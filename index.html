<style>
  :root{--bg-color:#f7f7f7;--text-color:#222;--gray-color:#888;--white:#fff}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;overscroll-behavior:none}
  /* 状态栏透明后壁纸铺到顶；用 padding 把内容让开安全区，图标位置不变。
     iOS 主屏幕 App 里页面不可滚动时，可视区会少一个状态栏高度(底部被裁掉)；
     和直链一样让文档比屏幕多 1px(可滚动)，并用 --app-h 把 body 撑满整屏 */
  html{background:var(--bg-color);height:auto;overflow:auto;min-height:calc(var(--app-h,100%) + 1px)}
  body{overflow:hidden;position:relative;height:var(--app-h,100vh);padding-top:env(safe-area-inset-top,0px)}
  body{background:var(--bg-color);font-family:var(--app-font,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif);display:flex;flex-direction:column;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}

  /* ===== 编辑模式顶部胶囊 ===== */
  .dynamic-edit-pill{
    position:fixed;top:calc(env(safe-area-inset-top,0px) + 16px);left:50%;
    transform:translateX(-50%) scale(.9) translateY(-90px);
    display:flex;align-items:center;
    background:rgba(30,30,30,.85);
    backdrop-filter:blur(25px) saturate(1.8);-webkit-backdrop-filter:blur(25px) saturate(1.8);
    border-radius:28px;padding:6px 8px;gap:4px;z-index:10000;
    opacity:0;visibility:hidden;pointer-events:none;
    transition:transform .4s cubic-bezier(.2,.8,.2,1),opacity .25s ease,visibility 0s .4s;
    box-shadow:0 16px 40px rgba(0,0,0,.2),inset 0 1px 0 rgba(255,255,255,.15);
    white-space:nowrap;
  }
  body.edit-mode .dynamic-edit-pill{
    transform:translateX(-50%) scale(1) translateY(0);
    opacity:1;visibility:visible;pointer-events:auto;
    transition:transform .4s cubic-bezier(.2,.8,.2,1),opacity .25s ease,visibility 0s;
  }
  .dep-btn{height:40px;padding:0 12px;border-radius:20px;display:flex;align-items:center;justify-content:center;gap:5px;color:#fff;font-size:13px;font-weight:600;cursor:pointer;transition:background .2s,transform .1s}
  .dep-btn:active{background:rgba(255,255,255,.15);transform:scale(.95)}
  .dep-btn.danger{color:#ff453a}
  .dep-btn.danger:active{background:rgba(255,69,58,.15)}
  .dep-btn.primary{background:#fff;color:#000;padding:0 18px;margin-left:2px}
  .dep-btn.primary:active{background:#e5e5e5}
  .dep-divider{width:1px;height:20px;background:rgba(255,255,255,.2);margin:0 2px;border-radius:1px}

  /* ===== 页面与网格 ===== */
  .pages-viewport{position:relative;flex:1 1 auto;min-height:0;overflow:hidden;z-index:10;touch-action:none;transform:translateZ(0);backface-visibility:hidden;-webkit-backface-visibility:hidden}
  .desktop.home-page{position:absolute;inset:0;padding:24px 16px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(6,minmax(80px,1fr));align-content:start;gap:12px;overflow:hidden;visibility:hidden;pointer-events:none;transform:translate3d(0,0,0);will-change:transform;backface-visibility:hidden;-webkit-backface-visibility:hidden;contain:layout style paint}
  .desktop.home-page.active-page{pointer-events:auto;z-index:2}
  body.edit-mode .desktop.home-page{padding-top:78px}

  .desktop-grid{position:absolute;inset:24px 16px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(6,minmax(80px,1fr));gap:12px;pointer-events:none;opacity:0;z-index:0;transition:opacity .18s ease}
  body.edit-mode .desktop-grid{opacity:1;inset:78px 16px 24px}
  .grid-slot{border-radius:22px;border:1px dashed rgba(0,0,0,.045);background:rgba(255,255,255,.035)}

  /* 拖动目标：左上角定位点 */
  .drag-target-block{position:absolute;inset:0;z-index:4;pointer-events:none;border-radius:22px;background:rgba(0,0,0,.035);border:1.5px dashed rgba(0,0,0,.16);box-shadow:inset 0 0 0 1px rgba(0,0,0,.025)}
  .drag-target-block::before{content:"";position:absolute;width:9px;height:9px;left:-5px;top:-5px;border-radius:50%;background:#555;border:2px solid rgba(255,255,255,.96);box-shadow:0 2px 7px rgba(0,0,0,.16);z-index:3}

  /* ===== 图标 ===== */
  .app{position:relative;width:100%;height:calc(var(--icon-size,64px) + 16px);min-width:0;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;z-index:2;transform:translate3d(0,0,0);transition:transform .18s cubic-bezier(.2,.8,.2,1);touch-action:none;-webkit-tap-highlight-color:transparent;-webkit-user-drag:none}
  .app .icon{pointer-events:none}
  .icon{width:var(--icon-size,64px);height:var(--icon-size,64px);background-color:var(--white);border-radius:var(--icon-radius,18px);box-shadow:0 4px 14px rgba(0,0,0,.035);display:flex;justify-content:center;align-items:center;font-size:13px;color:var(--text-color);font-weight:500;border:1px solid rgba(0,0,0,.022);transition:transform .18s cubic-bezier(.2,.8,.2,1),background-color .18s ease,box-shadow .18s ease;flex-shrink:0}
  .app:active .icon{background-color:#f0f0f0;transform:scale(.94);box-shadow:0 2px 8px rgba(0,0,0,.035)}
  .label{font-size:12px;color:var(--gray-color);text-align:center;font-weight:400;white-space:nowrap;pointer-events:none}

  .app.drag-placeholder{opacity:0!important;visibility:hidden!important;pointer-events:none!important;transform:translateZ(0)!important;transition:none!important;z-index:-1!important}
  .drag-ghost{position:fixed!important;z-index:2147483647!important;margin:0!important;pointer-events:none!important;transition:none!important;animation:none!important;transform:scale(1.04)!important;opacity:1!important;filter:drop-shadow(0 18px 28px rgba(0,0,0,.18))}
  .drag-ghost .icon{box-shadow:0 18px 38px rgba(0,0,0,.16)}
  body.edit-mode .app:not(.dragging):not(.drag-placeholder){animation:jiggle .55s infinite alternate ease-in-out}
  body.is-dragging-app .app{animation:none!important}
  @keyframes jiggle{0%{transform:rotate(-1.15deg)}100%{transform:rotate(1.15deg)}}

  /* ===== 翻页边缘提示 ===== */
  .edge-hint{position:absolute;top:0;bottom:0;width:56px;pointer-events:none;z-index:50;opacity:0;transition:opacity .14s ease,background .14s ease}
  .edge-hint.left{left:0}
  .edge-hint.right{right:0}
  .edge-hint.active{opacity:1;background:linear-gradient(to right,rgba(0,0,0,.045),transparent 72%)}
  .edge-hint.right.active{background:linear-gradient(to left,rgba(0,0,0,.045),transparent 72%)}
  .edge-hint.armed{opacity:1;background:linear-gradient(to right,rgba(0,0,0,.085),transparent 76%)}
  .edge-hint.right.armed{background:linear-gradient(to left,rgba(0,0,0,.085),transparent 76%)}

  /* ===== 页面指示器 ===== */
  .home-indicator-area{position:relative;z-index:500;height:34px;flex:0 0 34px;display:flex;align-items:center;justify-content:center}
  .home-indicator{min-width:42px;height:28px;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:999px;background:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.88);box-shadow:0 5px 16px rgba(0,0,0,.055),inset 0 1px 0 rgba(255,255,255,.9);backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);transform:translateY(-8px);transition:min-width .2s ease,padding .2s ease,transform .2s ease,background .2s ease}
  .home-indicator.search-mode{min-width:76px;padding-left:12px;padding-right:14px}
  .search-label{display:inline-block;font-size:13px;line-height:1;color:#666;letter-spacing:.2px;white-space:nowrap;font-weight:500}
  .search-symbol{display:block;flex-shrink:0}
  .page-dots{display:none;align-items:center;justify-content:center;gap:5px;max-width:80px}
  .home-indicator.pages-mode .search-symbol,.home-indicator.pages-mode .search-label{display:none}
  .home-indicator.pages-mode .page-dots{display:inline-flex}
  .page-dot{width:6px;height:6px;border-radius:50%;background:rgba(90,90,90,.42);flex:0 0 6px;border:0;padding:0;cursor:pointer;transition:background .2s ease}
  .page-dot.active{width:7.5px;height:7.5px;flex-basis:7.5px;background:rgba(40,40,40,.78)}

  .folder-modal-mask.open{opacity:1;visibility:visible;pointer-events:auto;background:rgba(20,20,22,.55);-webkit-backdrop-filter:blur(28px) saturate(1.15);backdrop-filter:blur(28px) saturate(1.15);transition:opacity .32s ease,background .38s ease,backdrop-filter .38s ease,visibility 0s}

<script>
/* iOS 主屏幕 App + 透明状态栏时，页面高度(100%/innerHeight)可能比整屏少一个状态栏，
   这里把整屏高度补回来（正常情况下不会触发） */
(function(){
  var r=document.documentElement;
  function lvh(){var d=document.createElement('div');d.style.cssText='position:fixed;left:0;top:0;width:1px;height:100lvh;visibility:hidden;pointer-events:none';r.appendChild(d);var h=d.offsetHeight;d.remove();return h}
  function fit(){
    var sa=(navigator.standalone===true)||(window.matchMedia&&matchMedia('(display-mode: standalone)').matches);
    var ih=window.innerHeight,iw=window.innerWidth,sh=Math.max(screen.height,screen.width),h=0;
    if(sa&&ih>=iw){h=Math.max(ih,lvh());if(sh>h&&sh-h<=120)h=sh}
    if(h>ih)r.style.setProperty('--app-h',h+'px');else r.style.removeProperty('--app-h');
  }
  fit();
  window.addEventListener('load',fit);
  window.addEventListener('resize',fit);
  window.addEventListener('orientationchange',function(){setTimeout(fit,300)});
  window.addEventListener('pageshow',fit);
})();
</script>

<script>
(() => {
  'use strict';
  const COLS=4,ROWS=6,SLOT_COUNT=COLS*ROWS,MIN_ROW_H=80;
  const LONG_PRESS_MS=700,CANCEL_PRESS_PX=10,SWIPE_START_PX=5,SWIPE_AXIS_RATIO=1.12,VERTICAL_BAIL_PX=10;
  const FLIP_RATIO=.10,FLIP_VELOCITY=.58,EDGE_DAMP=.22;
  const EDGE_ZONE=72,EDGE_HOLD_MS=160,EDGE_REPEAT_DELAY=1200,EDGE_FLIP_DURATION=440;
  const FOLDER_HOVER_MS=360,MAX_FOLDER_APPS=12,PUSH_DELAY_MS=280,MAX_DOCK_APPS=4,CLICK_GUARD_MS=350;
  const DEFAULT_FOLDER_NAME='未命名文件夹';
  const LAYOUT_KEY='xsj_layout_v1';

  const body=document.body;
  // 每个图标记下「原名」当内部标识；用户改的名字只是显示，不影响图标/应用/布局的对应
  document.querySelectorAll('.app').forEach(a=>{const l=a.querySelector('.label');if(l&&!a.dataset.key)a.dataset.key=l.textContent.trim()});
  const viewport=document.getElementById('pagesViewport');
  const dock=document.getElementById('dock');
  const homeIndicator=document.getElementById('homeIndicator');
  const pageDots=document.getElementById('pageDots');
  const addPageBtn=document.getElementById('addPageBtn');
  const delPageBtn=document.getElementById('delPageBtn');
  const doneBtn=document.getElementById('doneBtn');
  const edgeHintLeft=document.getElementById('edgeHintLeft');
  const edgeHintRight=document.getElementById('edgeHintRight');
  const folderModalMask=document.getElementById('folderModalMask');
  const folderModalTitle=document.getElementById('folderModalTitle');
  const folderModalGrid=document.getElementById('folderModalGrid');
  const folderModal=document.getElementById('folderModal');
  const dockWrapper=document.querySelector('.dock-wrapper');

  let openFolderEl=null,folderEditMode=false,folderPressTimer=null,folderPressOrigin=null,folderCloseTimer=null,folderSuppressClick=false;
  let pages=[],currentPageIndex=0,desktop=null;
  let pagePos=0,rafHandle=0,anim=null;
  let editMode=false,appDrag=null,swipe=null,pressTimer=null,pressOrigin=null,pressStartTime=0,lastPtr=null;
  let suppressNextClick=false,clickGuardTimer=0;
  let edgeTimer=null,edgeDir=0;
  let pendingMoveEvent=null,moveRafScheduled=false,saveTimer=0;

  const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
  const easeOutSmooth=t=>1-Math.pow(1-t,3.05);
  const damp=x=>Math.min(x*EDGE_DAMP,EDGE_DAMP);
  const isFolderEl=el=>!!el&&!!el.classList&&el.classList.contains('folder');
  const vibrate=p=>{if(navigator.vibrate)navigator.vibrate(p)};
  // 拖动/滑动/长按结束后的一小段时间内，吞掉紧随其后的 click
  function guardClick(){suppressNextClick=true;clearTimeout(clickGuardTimer);clickGuardTimer=setTimeout(()=>{suppressNextClick=false},CLICK_GUARD_MS)}

  function getPages(){return Array.from(viewport.querySelectorAll(':scope > .desktop.home-page'))}
  function createPageEl(){const p=document.createElement('div');p.className='desktop home-page';return p}

  /* ================= 翻页 ================= */
  function renderPages(pos){
    const n=pages.length;
    for(let i=0;i<n;i++){
      const p=pages[i],rel=i-pos,inView=rel>-1.5&&rel<1.5;
      if(inView){
        if(!p._visible){p._visible=true;p.style.visibility='visible'}
        p.style.transform='translate3d('+(rel*100)+'%,0,0)';
      }else if(p._visible){p._visible=false;p.style.visibility='hidden';p.style.transform=''}
    }
  }

  function cancelAnim(){if(rafHandle){cancelAnimationFrame(rafHandle);rafHandle=0}anim=null}

  function animateTo(target,duration){
    cancelAnim();
    const maxIdx=pages.length-1;
    target=clamp(Math.round(target*1000)/1000,0,maxIdx);
    const targetIndex=Math.round(target);
    if(targetIndex!==currentPageIndex){
      currentPageIndex=targetIndex;
      desktop=pages[targetIndex];
      for(let i=0;i<pages.length;i++)pages[i].classList.toggle('active-page',i===targetIndex);
      updatePageIndicator();
    }
    const from=pagePos,dist=target-from;
    if(Math.abs(dist)<.0005){pagePos=target;renderPages(pagePos);return}
    const dur=duration!=null?duration:clamp(400+Math.abs(dist)*95,400,540);
    anim={from,to:target,start:performance.now(),duration:dur};
    const tick=now=>{
      if(!anim)return;
      const t=clamp((now-anim.start)/anim.duration,0,1);
      pagePos=anim.from+(anim.to-anim.from)*easeOutSmooth(t);
      renderPages(pagePos);
      if(t<1)rafHandle=requestAnimationFrame(tick);
      else{rafHandle=0;pagePos=anim.to;anim=null;renderPages(pagePos)}
    };
    rafHandle=requestAnimationFrame(tick);
  }

  function commitPage(index){
    currentPageIndex=index;desktop=pages[index];pagePos=index;
    for(let i=0;i<pages.length;i++)pages[i].classList.toggle('active-page',i===index);
    updatePageIndicator();
  }
  function goToPage(index){index=clamp(Math.round(index),0,pages.length-1);if(index===currentPageIndex&&pagePos===index)return;animateTo(index)}

  /* ================= 拖到边缘自动翻页 ================= */
  function setEdgeHint(dir,armed){
    edgeHintLeft.classList.remove('active','armed');edgeHintRight.classList.remove('active','armed');
    const el=dir===-1?edgeHintLeft:(dir===1?edgeHintRight:null);
    if(el){el.classList.add('active');if(armed)el.classList.add('armed')}
  }
  function clearEdgeTimer(){if(edgeTimer){clearTimeout(edgeTimer);edgeTimer=null}edgeDir=0;setEdgeHint(0,false)}
  function checkEdgeTrigger(x,rect){
    if(!appDrag){clearEdgeTimer();return}
    const r=rect||viewport.getBoundingClientRect();
    const distLeft=x-r.left,distRight=r.right-x;
    let dir=0;
    if(distLeft<EDGE_ZONE&&currentPageIndex>0)dir=-1;
    else if(distRight<EDGE_ZONE&&currentPageIndex<pages.length-1)dir=1;
    if(dir===0){clearEdgeTimer();return}
    if(dir===edgeDir&&edgeTimer){setEdgeHint(dir,false);return}
    if(dir!==edgeDir){if(edgeTimer){clearTimeout(edgeTimer);edgeTimer=null}edgeDir=dir}
    setEdgeHint(dir,false);scheduleEdgeFlip(dir,EDGE_HOLD_MS);
  }
  function scheduleEdgeFlip(dir,wait){
    edgeTimer=setTimeout(()=>{
      edgeTimer=null;if(!appDrag||edgeDir!==dir)return;
      const newIndex=currentPageIndex+dir;
      if(newIndex<0||newIndex>=pages.length){edgeDir=0;setEdgeHint(0,false);return}
      animateTo(newIndex,EDGE_FLIP_DURATION);setEdgeHint(dir,true);
      vibrate(6);
      scheduleEdgeFlip(dir,EDGE_REPEAT_DELAY);
    },wait);
  }

  /* ================= 指针事件：长按 / 滑动 / 拖动入口 ================= */
  function onPointerDown(e){
    if(e.pointerType==='mouse'&&e.button>0)return;
    if(!pages.length)return;
    const inViewport=viewport.contains(e.target);
    const inDock=dock.contains(e.target);
    if(!inViewport&&!inDock)return;
    if(editMode){
      const appEl=e.target.closest('.app');
      if(appEl){const parent=appEl.parentElement;if(parent===desktop||parent===dock){e.preventDefault();startAppDrag(appEl,e);return}}
      if(inViewport)startSwipe(e);
      return;
    }
    if(inViewport)startSwipe(e);
    clearPressTimer();
    const pressAppEl=e.target.closest('.app');
    const isAppPress=!!(pressAppEl&&(pressAppEl.parentElement===desktop||pressAppEl.parentElement===dock));
    if(!isAppPress)return;
    pressOrigin={x:e.clientX,y:e.clientY};
    pressStartTime=performance.now();
    const pressPointerId=e.pointerId;
    const pressRect=pressAppEl.getBoundingClientRect();
    lastPtr={x:e.clientX,y:e.clientY,id:pressPointerId};
    pressTimer=setTimeout(()=>{
      if(performance.now()-pressStartTime<LONG_PRESS_MS-30)return;
      pressTimer=null;
      if(swipe&&swipe.active)return;
      enterEditMode();guardClick();
      // 长按后手指不松直接拖：当场开始拖动该 APP
      if(!appDrag&&pressAppEl.isConnected&&lastPtr&&lastPtr.id===pressPointerId){
        swipe=null;
        startAppDrag(pressAppEl,{pointerId:pressPointerId,clientX:lastPtr.x,clientY:lastPtr.y},pressRect);
        if(appDrag)appDrag.fromLongPress=true;
      }
    },LONG_PRESS_MS);
  }
  function clearPressTimer(){if(pressTimer){clearTimeout(pressTimer);pressTimer=null}pressOrigin=null}

  function scheduleMoveFrame(){
    if(moveRafScheduled)return;
    moveRafScheduled=true;
    requestAnimationFrame(flushMoveFrame);
  }
  function flushMoveFrame(){
    moveRafScheduled=false;
    const e=pendingMoveEvent;pendingMoveEvent=null;
    if(!e)return;
    if(appDrag&&e.pointerId===appDrag.pointerId)moveAppDrag(e);
    else if(swipe&&e.pointerId===swipe.pointerId)moveSwipe(e);
  }
  function onPointerMove(e){
    lastPtr={x:e.clientX,y:e.clientY,id:e.pointerId};
    if(appDrag){if(e.pointerId!==appDrag.pointerId)return;e.preventDefault();pendingMoveEvent=e;scheduleMoveFrame();return}
    if(swipe&&e.pointerId===swipe.pointerId){pendingMoveEvent=e;scheduleMoveFrame();return}
    if(pressOrigin){const dx=e.clientX-pressOrigin.x,dy=e.clientY-pressOrigin.y;if(dx*dx+dy*dy>CANCEL_PRESS_PX*CANCEL_PRESS_PX)clearPressTimer()}
  }

  function startSwipe(e){cancelAnim();const rect=viewport.getBoundingClientRect();swipe={pointerId:e.pointerId,startX:e.clientX,startY:e.clientY,lastX:e.clientX,lastTime:performance.now(),width:rect.width||1,basePos:pagePos,velocity:0,active:false}}
  function moveSwipe(e){
    const s=swipe,dx=e.clientX-s.startX,dy=e.clientY-s.startY,adx=Math.abs(dx),ady=Math.abs(dy);
    if(adx+ady>CANCEL_PRESS_PX)clearPressTimer();
    if(!s.active){if(adx>SWIPE_START_PX&&adx>ady*SWIPE_AXIS_RATIO)s.active=true;else if(ady>VERTICAL_BAIL_PX&&ady>adx*SWIPE_AXIS_RATIO){swipe=null;clearPressTimer();return}else return}
    const now=performance.now(),dt=now-s.lastTime;
    if(dt>0&&dt<80){const v=-(e.clientX-s.lastX)/dt*1000/s.width;s.velocity=s.velocity*.32+v*.68}
    s.lastX=e.clientX;s.lastTime=now;

  }
  function endSwipe(e){
    const s=swipe;swipe=null;if(!s)return;

    const sinceLast=performance.now()-s.lastTime;
    const decay=sinceLast>0?Math.max(0,1-sinceLast/160):1;
    const vPages=s.velocity*decay;

    if(shouldFlip&&dir!==0)target=dir>0?Math.floor(base+.001)+1:Math.ceil(base-.001)-1;
    else if(dir!==0&&ratio>.012)target=Math.round(base+dir*.28);

  function onPointerUp(e){

  function onPointerCancel(){

  }

  /* ================= 网格 / 槽位 ================= */
  function buildGrid(target){
    let grid=target.querySelector('.desktop-grid');
    if(!grid){grid=document.createElement('div');grid.className='desktop-grid';target.prepend(grid)}
    if(grid.childElementCount===SLOT_COUNT)return;
    grid.innerHTML='';
    const frag=document.createDocumentFragment();
    for(let i=0;i<SLOT_COUNT;i++){const slot=document.createElement('div');slot.className='grid-slot';frag.appendChild(slot)}
    grid.appendChild(frag);
  }
  function setDesktopSlot(app,index,flip){
    index=clamp(Number(index)||0,0,SLOT_COUNT-1);
    const before=(flip&&app.isConnected)?app.getBoundingClientRect():null;
    app.dataset.area='desktop';app.dataset.slot=String(index);
    app.style.gridColumn=String((index%COLS)+1);
    app.style.gridRow=String(Math.floor(index/COLS)+1);
    if(before&&before.width>0&&app.animate){
      // 让位动画：从旧位置滑到新位置（用独立的 translate 属性，不会打断编辑模式的抖动）
      const after=app.getBoundingClientRect();
      const dx=before.left-after.left,dy=before.top-after.top;
      if(Math.abs(dx)>1||Math.abs(dy)>1){
        try{app.animate([{translate:dx+'px '+dy+'px'},{translate:'0px 0px'}],{duration:240,easing:'cubic-bezier(.2,.9,.2,1)'})}catch(_){}
      }
    }
  }
  function normalizeDockSlots(){dockApps().forEach((app,i)=>{app.dataset.area='dock';app.dataset.slot=String(i);app.style.gridColumn='';app.style.gridRow=''})}
  function initializeSlots(){pages.forEach(page=>{pageApps(page).forEach((app,i)=>setDesktopSlot(app,i,false))});normalizeDockSlots()}
  function pageApps(pageEl,except){return Array.from(pageEl.querySelectorAll(':scope > .app')).filter(a=>a!==except)}
  function desktopApps(){return pageApps(desktop)}
  function dockApps(){return Array.from(dock.querySelectorAll(':scope > .app'))}
  function dockHasRoom(exceptApp){return dockApps().filter(a=>a!==exceptApp).length<MAX_DOCK_APPS}
  function updateDockFit(){
    const n=dockApps().length;
    dock.classList.toggle('dock-compact',n>0&&n<MAX_DOCK_APPS);
  }
  function slotTaken(pageEl,index,except){return pageApps(pageEl,except).some(a=>Number(a.dataset.slot)===index)}
  function findFreeSlot(pageEl,except){
    const used=new Set(pageApps(pageEl,except).map(a=>Number(a.dataset.slot)));
    for(let i=0;i<SLOT_COUNT;i++)if(!used.has(i))return i;
    return -1;
  }
  // 把图标放到 preferred 页的第一个空格；这一页满了就找别的页。全满返回 false
  function placeOnFreePage(app,preferred){
    const order=[preferred].concat(pages.filter(p=>p!==preferred));
    for(const pg of order){
      const fs=findFreeSlot(pg,app);
      if(fs>=0){if(app.parentElement!==pg)pg.appendChild(app);setDesktopSlot(app,fs,false);return true}
    }
    return false;
  }

  /* ================= 拖动：目标提示 ================= */
  function clearTarget(){
    viewport.querySelectorAll('.drag-target-block').forEach(b=>b.remove());
    dock.classList.remove('drag-target');
  }
  function showTarget(area,index){
    clearTarget();
    if(area==='desktop'){
      const grid=desktop.querySelector('.desktop-grid');
      if(!grid)return;
      const start=clamp(Number(index)||0,0,SLOT_COUNT-1);
      const block=document.createElement('div');
      block.className='drag-target-block';
      // 必须同时写起止线：绝对定位的网格项只写起始线时，结束线默认是网格容器的边缘，
      // 虚线框会从这一格一直拉到右下角，看起来就是「好几格连在一起」
      const c0=start%COLS,r0=Math.floor(start/COLS);
      block.style.gridColumn=(c0+1)+' / '+(c0+2);
      block.style.gridRow=(r0+1)+' / '+(r0+2);
      grid.appendChild(block);
    }else dock.classList.add('drag-target');
  }
  function pointInRect(x,y,r){return x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom}
  function nearestDesktopSlot(x,y){
    const r=viewport.getBoundingClientRect(),cs=getComputedStyle(desktop);
    const pl=parseFloat(cs.paddingLeft)||0,pr=parseFloat(cs.paddingRight)||0,pt=parseFloat(cs.paddingTop)||0,pb=parseFloat(cs.paddingBottom)||0;
    const gx=parseFloat(cs.columnGap)||0,gy=parseFloat(cs.rowGap)||0;
    const innerW=r.width-pl-pr,innerH=r.height-pt-pb;
    // 行高有 80px 下限（小屏时网格会溢出而不是继续压缩），这里要与 CSS 保持一致
    const cellW=(innerW-gx*(COLS-1))/COLS,cellH=Math.max(MIN_ROW_H,(innerH-gy*(ROWS-1))/ROWS);
    const localX=clamp(x-r.left-pl,0,innerW-1),localY=clamp(y-r.top-pt,0,innerH-1);
    const col=clamp(Math.floor((localX+gx/2)/(cellW+gx)),0,COLS-1);
    const row=clamp(Math.floor((localY+gy/2)/(cellH+gy)),0,ROWS-1);
    return row*COLS+col;
  }
  function nearestDockInsertIndex(x){const items=dockApps().filter(a=>!appDrag||a!==appDrag.app);for(let i=0;i<items.length;i++){const r=items[i].getBoundingClientRect();if(x<r.left+r.width/2)return i}return items.length}
  function createDragGhost(app,rect){const ghost=app.cloneNode(true);ghost.classList.remove('drag-placeholder','dragging');ghost.classList.add('drag-ghost');ghost.removeAttribute('style');ghost.style.width=rect.width+'px';ghost.style.height=rect.height+'px';ghost.style.left=rect.left+'px';ghost.style.top=rect.top+'px';ghost.style.pointerEvents='none';document.body.appendChild(ghost);return ghost}

  /* ================= 拖动：开始 / 文件夹合成 ================= */
  function startAppDrag(app,e,rectOverride){
    if(appDrag)return;
    const rect=rectOverride||app.getBoundingClientRect();
    const originArea=app.dataset.area||(app.parentElement===dock?'dock':'desktop');
    const originSlot=Number(app.dataset.slot||0);
    appDrag={
      app,pointerId:e.pointerId,originArea,originSlot,
      originPageIndex:currentPageIndex,currentArea:originArea,
      currentSlot:originSlot,startX:e.clientX,startY:e.clientY,
      moved:false,offsetX:e.clientX-rect.left,offsetY:e.clientY-rect.top,
      ghost:null,rect,
      dockRect:dockWrapper.getBoundingClientRect(),
      desktopRect:viewport.getBoundingClientRect()
    };
    try{app.setPointerCapture(e.pointerId)}catch(_){}
  }

  function clearFolderHover(d){
    if(d.folderHoverApp)d.folderHoverApp.classList.remove('folder-target');
    d.folderHoverApp=null;
    if(d.folderHoverTimer){clearTimeout(d.folderHoverTimer);d.folderHoverTimer=null}
  }
  function setFolderHover(d,target){
    if(d.folderHoverApp===target)return;
    clearFolderHover(d);
    d.folderHoverApp=target;
    target.classList.add('folder-target');
    d.folderHoverTimer=setTimeout(()=>{
      d.folderHoverTimer=null;
      if(appDrag===d&&d.folderHoverApp===target){vibrate(12);triggerFolderMerge(d,target)}
    },FOLDER_HOVER_MS);
  }
  function triggerFolderMerge(d,target){
    if(appDrag!==d||!target||!target.isConnected)return;
    const app=d.app;
    clearEdgeTimer();
    clearFolderHover(d);
    app.classList.remove('drag-placeholder','dragging');
    if(d.ghost)d.ghost.remove();
    clearTarget();
    mergeAppsIntoFolder(target,app);
    normalizeDockSlots();updateDockFit();
    try{app.releasePointerCapture(d.pointerId)}catch(_){}
    appDrag=null;
    body.classList.remove('is-dragging-app');
    guardClick();
    saveLayout();
  }
  // 按布局量图标位置（offsetLeft/Top），不受让位动画和抖动旋转影响，
  // 否则图标一边在动一边判定，目标位置来回跳，就会「怎么都放不进去」
  function stableIconRect(a){
    const icon=a.querySelector('.icon');if(!icon)return null;
    if(a.offsetParent&&a.offsetParent===desktop&&icon.offsetWidth){
      const pr=desktop.getBoundingClientRect();
      const l=pr.left+a.offsetLeft+icon.offsetLeft,t=pr.top+a.offsetTop+icon.offsetTop;
      return {left:l,top:t,right:l+icon.offsetWidth,bottom:t+icon.offsetHeight,width:icon.offsetWidth,height:icon.offsetHeight};
    }
    return icon.getBoundingClientRect();
  }
  function findFolderMergeTarget(d,x,y){
    if(isFolderEl(d.app))return null;
    const gIcon=d.ghost&&d.ghost.querySelector('.icon');
    const gr=gIcon?gIcon.getBoundingClientRect():{left:x-28,right:x+28,top:y-28,bottom:y+28};
    const gcx=(gr.left+gr.right)/2,gcy=(gr.top+gr.bottom)/2;
    let best=null,bestScore=0;
    desktopApps().forEach(a=>{
      if(a===d.app)return;
      if(isFolderEl(a)&&a.querySelector('.folder-items').children.length>=MAX_FOLDER_APPS)return;
      const r=stableIconRect(a);if(!r)return;
      // 进入范围要对得比较准（0.5 个图标），但一旦已经瞄准，手稍微抖一下不会丢（0.72）
      const lim=(a===d.folderHoverApp)?0.72:0.5;
      const dxc=Math.abs(gcx-(r.left+r.right)/2),dyc=Math.abs(gcy-(r.top+r.bottom)/2);
      if(dxc>r.width*lim||dyc>r.height*lim)return;
      const score=1/(1+dxc+dyc);
      if(score>bestScore){bestScore=score;best=a}
    });
    return best;
  }

  /* ================= 拖动：自由摆放 + 顺推让位 ================= */
  // 图标放在哪一格就留在哪一格，不会自动紧凑到最前面
  function captureBase(d){
    d.baselinePage=desktop;
    d.baseSlots=new Map(pageApps(desktop,d.app).map(a=>[a,Number(a.dataset.slot)]));
    d.lastInsertIndex=-1;
  }
  function restorePush(d){
    clearTimeout(d.pushTimer);d.pushedSlot=-1;
    if(d.baseSlots)d.baseSlots.forEach((sl,a)=>{if(a.isConnected&&Number(a.dataset.slot)!==sl)setDesktopSlot(a,sl,true)});
    d.lastInsertIndex=-1;
  }
  function ensureBase(d){
    if(d.baselinePage!==desktop){if(d.baselinePage)restorePush(d);captureBase(d)}
  }
  // 目标格子已有图标时，把它和紧挨着的一串图标顺推一格；空格保持为空，不会把别处的图标拉过来
  function applyPush(d,slot){
    restorePush(d);
    const at=new Map();
    pageApps(desktop,d.app).forEach(a=>at.set(Number(a.dataset.slot),a));
    if(!at.has(slot))return;
    let end=slot;while(end<SLOT_COUNT&&at.has(end))end++;
    if(end<SLOT_COUNT){for(let i=end-1;i>=slot;i--)setDesktopSlot(at.get(i),i+1,true);return}
    let start=slot;while(start>=0&&at.has(start))start--;
    if(start>=0){for(let i=start+1;i<=slot;i++)setDesktopSlot(at.get(i),i-1,true)}
  }
  function updateDesktopDragState(d,x,y){
    if(d.baselinePage!==desktop){ensureBase(d);clearFolderHover(d)}
    const mergeTarget=findFolderMergeTarget(d,x,y);
    if(mergeTarget){
      setFolderHover(d,mergeTarget);
      clearTarget();
      restorePush(d);
      d.currentArea='desktop';d.currentSlot=Number(mergeTarget.dataset.slot);
      return;
    }
    clearFolderHover(d);
    const slot=nearestDesktopSlot(x,y);
    const occupied=Array.from(d.baseSlots.values()).includes(slot);
    const schedulePush=()=>{
      clearTimeout(d.pushTimer);
      d.pushTimer=setTimeout(()=>{
        if(appDrag===d&&d.lastInsertIndex===slot&&d.currentArea==='desktop'&&!d.folderHoverApp){
          applyPush(d,slot);d.lastInsertIndex=slot;d.pushedSlot=slot;
        }
      },PUSH_DELAY_MS);
    };
    if(slot!==d.lastInsertIndex){
      if(!occupied){applyPush(d,slot);d.lastInsertIndex=slot}
      else{
        // 目标格有图标：手指基本停住约 0.1 秒才让位；还在移动（比如正往图标中心靠近、想合成文件夹）时不让位
        restorePush(d);d.lastInsertIndex=slot;d.dwellX=x;d.dwellY=y;schedulePush();
      }
    }else if(occupied&&d.pushedSlot!==slot){
      if(Math.hypot(x-d.dwellX,y-d.dwellY)>5){d.dwellX=x;d.dwellY=y;schedulePush()}
    }
    d.currentArea='desktop';d.currentSlot=slot;
    showTarget('desktop',slot);
  }

  function moveAppDrag(e){
    const d=appDrag;
    if(!d)return;
    e.preventDefault();
    if(!d.moved){
      const dx=e.clientX-d.startX,dy=e.clientY-d.startY;
      if(dx*dx+dy*dy>20){
        d.moved=true;
        d.app.classList.add('drag-placeholder','dragging');
        body.classList.add('is-dragging-app');
        showTarget(d.currentArea,d.currentSlot);
        if(!d.ghost)d.ghost=createDragGhost(d.app,d.rect);
      }
    }
    if(!d.moved)return;
    if(d.ghost){
      d.ghost.style.left=(e.clientX-d.offsetX)+'px';
      d.ghost.style.top=(e.clientY-d.offsetY-2)+'px';
    }
    const x=e.clientX,y=e.clientY;
    if(pointInRect(x,y,d.dockRect)&&dockHasRoom(d.app)){
      clearFolderHover(d);restorePush(d);
      d.currentArea='dock';d.currentSlot=nearestDockInsertIndex(x);
      showTarget('dock',d.currentSlot);clearEdgeTimer();
    }else if(pointInRect(x,y,d.desktopRect)){
      d.currentArea='desktop';

    }else{clearFolderHover(d);restorePush(d);clearEdgeTimer()}
  }

  function endAppDrag(e){
    const d=appDrag;if(!d||e.pointerId!==d.pointerId)return;
    clearEdgeTimer();
    if(d.moved||d.fromLongPress)guardClick();
    const app=d.app;
    clearFolderHover(d);

    let area=d.currentArea,slot=d.currentSlot;
    if(pointInRect(e.clientX,e.clientY,d.dockRect)&&dockHasRoom(app)){
      area='dock';slot=nearestDockInsertIndex(e.clientX);
    }else if(pointInRect(e.clientX,e.clientY,d.desktopRect)){
      area='desktop';slot=nearestDesktopSlot(e.clientX,e.clientY);
    }
    clearTarget();
    app.classList.remove('drag-placeholder','dragging');
    if(d.ghost)d.ghost.remove();
    if(area==='dock'){
      restorePush(d);
      const others=dockApps().filter(x=>x!==app);
      const at=clamp(slot,0,others.length);
      dock.insertBefore(app,others[at]||null);
    }else{
      ensureBase(d);applyPush(d,slot);
      if(slotTaken(desktop,slot,app)){
        // 顺推也没腾出位置（这一页已经满了）：不能叠在别的图标上，整个放回原处
        const fs=findFreeSlot(desktop,app);

      setDesktopSlot(app,slot,false);
    }

    try{app.releasePointerCapture(d.pointerId)}catch(_){}
    appDrag=null;
    body.classList.remove('is-dragging-app');
  }

  function cancelAppDrag(){
    const d=appDrag;if(!d)return;
    clearEdgeTimer();
    clearFolderHover(d);
    if(d.moved)guardClick();
    const app=d.app;
    app.classList.remove('drag-placeholder','dragging');
    if(d.ghost)d.ghost.remove();
    restorePush(d);
    if(d.originArea==='dock'){

      const items=dockApps().filter(x=>x!==app);

      normalizeDockSlots();
    }else{
      const originPage=pages[d.originPageIndex]||pages[0];
      if(app.parentElement!==originPage)originPage.appendChild(app);
      setDesktopSlot(app,d.originSlot,false);
    }
    updateDockFit();
    try{app.releasePointerCapture(d.pointerId)}catch(_){}
    clearTarget();appDrag=null;
    body.classList.remove('is-dragging-app');
  }

  /* ================= 文件夹 ================= */
  function buildFolderShell(name){
    const folder=document.createElement('div');
    folder.className='app folder';
    folder.dataset.folderName=name;
    folder.innerHTML='<div class="icon folder-icon"><div class="folder-mini"></div></div><span class="label"></span><div class="folder-items" style="display:none"></div>';
    folder.querySelector('.label').textContent=name;
    return folder;
  }
  function renderFolderPreview(folder){
    const mini=folder.querySelector('.folder-mini');
    const items=Array.from(folder.querySelector('.folder-items').children).slice(0,9);
    mini.innerHTML='';
    items.forEach(a=>{
      const span=document.createElement('span');
      const srcIcon=a.querySelector('.icon');
      span.textContent=srcIcon?srcIcon.textContent.trim().slice(0,2):'';
      if(srcIcon&&srcIcon.classList.contains('has-img')&&srcIcon.style.backgroundImage){span.classList.add('has-img');span.style.backgroundImage=srcIcon.style.backgroundImage}
      mini.appendChild(span);
    });
  }
  function addAppsToFolder(folder,appsArr){
    const items=folder.querySelector('.folder-items');
    const room=MAX_FOLDER_APPS-items.children.length;
    appsArr.slice(0,Math.max(0,room)).forEach(a=>{a.remove();a.removeAttribute('style');items.appendChild(a)});
    renderFolderPreview(folder);
    vibrate(16);
  }
  function mergeAppsIntoFolder(targetApp,movingApp){
    if(isFolderEl(targetApp)){
      addAppsToFolder(targetApp,[movingApp]);
      return;
    }
    const slot=Number(targetApp.dataset.slot||0);
    const parent=targetApp.parentElement;
    const folder=buildFolderShell(DEFAULT_FOLDER_NAME);
    parent.insertBefore(folder,targetApp);
    const items=folder.querySelector('.folder-items');
    targetApp.remove();movingApp.remove();
    targetApp.removeAttribute('style');movingApp.removeAttribute('style');
    items.appendChild(targetApp);items.appendChild(movingApp);
    setDesktopSlot(folder,slot,false);
    renderFolderPreview(folder);
    vibrate(16);
  }
  // 把弹窗里的图标恢复成普通状态（去掉角标/抖动/内联样式）
  function resetModalApp(a){
    const badge=a.querySelector('.folder-remove-badge');if(badge)badge.remove();
    a.classList.remove('jiggle');
    a.removeAttribute('style');
  }
  function closeFolderModalRaw(){
    clearTimeout(folderCloseTimer);
    folderModalMask.classList.remove('open');
    folderModalMask.classList.add('closing');
    folderCloseTimer=setTimeout(()=>{
      folderModalMask.classList.remove('closing');
      folderModalGrid.innerHTML='';
    },320);
    openFolderEl=null;folderEditMode=false;
  }
  function closeFolderModal(){
    const folder=openFolderEl;
    if(!folder){closeFolderModalRaw();return}
    const items=folder.querySelector('.folder-items');
    Array.from(folderModalGrid.children).forEach(a=>{resetModalApp(a);items.appendChild(a)});
    folder.dataset.folderName=folderModalTitle.value.trim()||DEFAULT_FOLDER_NAME;
    folder.querySelector('.label').textContent=folder.dataset.folderName;
    renderFolderPreview(folder);
    closeFolderModalRaw();
    saveLayout();
  }
  function removeFromOpenFolder(app){
    const folder=openFolderEl;if(!folder||!app)return;
    // 所有页面都满了就没地方放，保持原样
    if(!pages.some(pg=>findFreeSlot(pg,null)>=0)){vibrate([18,35,18]);return}
    resetModalApp(app);
    placeOnFreePage(app,desktop);
    vibrate(10);
    const remaining=Array.from(folderModalGrid.children);
    if(remaining.length<=1){
      // 只剩一个：文件夹解散，剩下的那个顶替文件夹原来的位置
      const host=folder.parentElement,fslot=Number(folder.dataset.slot);
      remaining.forEach(a=>{
        resetModalApp(a);
        if(host===dock)dock.insertBefore(a,folder);
        else{host.appendChild(a);setDesktopSlot(a,isNaN(fslot)?0:fslot,false)}
      });
      folder.remove();
      if(host===dock){normalizeDockSlots();updateDockFit()}
      closeFolderModalRaw();
    }
    saveLayout();
  }
  function openFolder(folder){
    if(appDrag||openFolderEl)return;
    clearTimeout(folderCloseTimer);
    folderModalMask.classList.remove('closing');
    openFolderEl=folder;folderEditMode=false;
    folderModalTitle.value=folder.dataset.folderName||DEFAULT_FOLDER_NAME;
    const items=folder.querySelector('.folder-items');
    folderModalGrid.innerHTML='';
    Array.from(items.children).forEach(a=>{
      a.removeAttribute('style');
      const badge=document.createElement('div');
      badge.className='folder-remove-badge';badge.textContent='×';
      a.appendChild(badge);
      folderModalGrid.appendChild(a);
    });
    const iconRect=folder.querySelector('.icon').getBoundingClientRect();
    const mRect=folderModal.getBoundingClientRect();
    const ox=((iconRect.left+iconRect.width/2)-mRect.left)/mRect.width*100;
    const oy=((iconRect.top+iconRect.height/2)-mRect.top)/mRect.height*100;
    folderModal.style.transformOrigin=clamp(ox,0,100)+'% '+clamp(oy,0,100)+'%';
    folderModalMask.classList.add('open');
    vibrate(10);
  }

  /* ================= 编辑模式 / 页面增删 ================= */
  function enterEditMode(){if(editMode)return;editMode=true;body.classList.add('edit-mode');vibrate(45)}
  function exitEditMode(){if(!editMode)return;if(appDrag)cancelAppDrag();editMode=false;body.classList.remove('edit-mode');clearTarget();clearEdgeTimer();saveLayout()}

  function addPage(){
    if(!editMode)return;
    const page=createPageEl();
    viewport.appendChild(page);buildGrid(page);
    pages=getPages();saveLayout();vibrate(30);
    animateTo(pages.length-1,420);
  }
  function deletePage(){
    if(!editMode)return;
    if(currentPageIndex===0||pages.length<=1){vibrate([18,35,18]);return}
    cancelAnim();
    const delIdx=currentPageIndex,toDelete=pages[delIdx];
    const orphans=pageApps(toDelete);
    const origSlots=new Map(orphans.map(x=>[x,Number(x.dataset.slot)]));
    // 只搬动被删页里的 APP：优先放前一页，其次其他页；其他页面的图标保持原位
    const targets=[pages[delIdx-1]].concat(pages.filter((pg,i)=>pg!==toDelete&&i!==delIdx-1));
    const placed=[];
    for(const app of orphans){
      let ok=false;
      for(const pg of targets){
        const free=findFreeSlot(pg,app);
        if(free>=0){pg.appendChild(app);setDesktopSlot(app,free,false);placed.push(app);ok=true;break}
      }
      if(!ok){
        // 放不下：全部还原，不删除
        placed.forEach(x=>{toDelete.appendChild(x);setDesktopSlot(x,origSlots.get(x),false)});
        vibrate([18,35,18]);
        return;
      }
    }
    toDelete.remove();
    pages=getPages();
    const newIdx=clamp(Math.min(delIdx,pages.length-1),0,pages.length-1);
    commitPage(newIdx);renderPages(newIdx);saveLayout();
    vibrate(30);
  }

  function updatePageIndicator(){
    const count=pages.length,isHome=currentPageIndex===0;
    homeIndicator.classList.toggle('search-mode',isHome);
    homeIndicator.classList.toggle('pages-mode',!isHome&&count>1);
    pageDots.innerHTML='';
    if(isHome||count<2)return;
    const windowSize=Math.min(3,count);
    let start=Math.max(0,currentPageIndex-Math.floor(windowSize/2));
    let end=start+windowSize-1;
    if(end>=count){end=count-1;start=Math.max(0,end-windowSize+1)}
    const frag=document.createDocumentFragment();
    for(let i=start;i<=end;i++){
      const dot=document.createElement('button');
      dot.type='button';
      dot.className='page-dot'+(i===currentPageIndex?' active':'');
      dot.setAttribute('aria-label','第 '+(i+1)+' 页');
      dot.addEventListener('click',ev=>{ev.stopPropagation();goToPage(i)});
      frag.appendChild(dot);
    }
    pageDots.appendChild(frag);
  }

  /* ================= 事件绑定 ================= */
  body.addEventListener('click',e=>{
    if(suppressNextClick)return;
    const t=e.target;
    const appEl=t.closest('.app');
    if(appEl&&isFolderEl(appEl)&&!t.closest('.folder-modal-mask')){openFolder(appEl);return}
    if(appEl&&!editMode&&!t.closest('.folder-modal-mask')){openApp(appLabel(appEl));return}
    if(editMode&&!appEl&&!t.closest('.dynamic-edit-pill')&&!t.closest('.folder-modal-mask'))exitEditMode();
  });

  folderModalMask.addEventListener('click',e=>{if(e.target===folderModalMask)closeFolderModal()});
  folderModalTitle.addEventListener('keydown',e=>{if(e.key==='Enter')folderModalTitle.blur()});
  folderModalGrid.addEventListener('pointerdown',e=>{
    if(!e.target.closest('.app'))return;
    folderPressOrigin={x:e.clientX,y:e.clientY};
    clearTimeout(folderPressTimer);
    folderPressTimer=setTimeout(()=>{
      folderEditMode=true;
      Array.from(folderModalGrid.children).forEach(a=>a.classList.add('jiggle'));
      vibrate(30);
      folderSuppressClick=true;setTimeout(()=>{folderSuppressClick=false},CLICK_GUARD_MS);
    },LONG_PRESS_MS);
  });
  folderModalGrid.addEventListener('pointermove',e=>{
    if(!folderPressOrigin)return;
    const dx=e.clientX-folderPressOrigin.x,dy=e.clientY-folderPressOrigin.y;
    if(dx*dx+dy*dy>CANCEL_PRESS_PX*CANCEL_PRESS_PX){clearTimeout(folderPressTimer);folderPressOrigin=null}
  });
  ['pointerup','pointercancel'].forEach(evt=>folderModalGrid.addEventListener(evt,()=>{clearTimeout(folderPressTimer);folderPressOrigin=null}));
  folderModalGrid.addEventListener('click',e=>{
    if(folderSuppressClick)return;
    const badge=e.target.closest('.folder-remove-badge');
    if(badge){e.stopPropagation();removeFromOpenFolder(badge.closest('.app'));return}
    if(folderEditMode){
      e.stopPropagation();
      folderEditMode=false;
      Array.from(folderModalGrid.children).forEach(a=>a.classList.remove('jiggle'));
    }else{
      const a=e.target.closest('.app');
      if(a&&APP_FILES[appLabel(a)]){e.stopPropagation();closeFolderModal();openApp(appLabel(a))}
    }
  });

  document.addEventListener('pointerdown',onPointerDown,{passive:false});
  window.addEventListener('pointermove',onPointerMove,{passive:false});
  window.addEventListener('pointerup',onPointerUp,{passive:false});
  window.addEventListener('pointercancel',onPointerCancel,{passive:false});
  addPageBtn.addEventListener('click',addPage);
  delPageBtn.addEventListener('click',deletePage);
  doneBtn.addEventListener('click',exitEditMode);
  document.addEventListener('gesturestart',e=>e.preventDefault());
  // 安卓长按图标会弹系统菜单并打断长按/拖动，这里拦掉
  document.addEventListener('contextmenu',e=>{if(e.target.closest&&e.target.closest('.app'))e.preventDefault()});


  /* ================= 美化接线：全局主题 + 应用层 =================
     美化 把设置写进 localStorage('phoneTheme')，并通知这里；这里读出来应用到整个桌面 */
  const THEME_KEY='phoneTheme',NAMES_KEY='xsj_app_names';
  const APP_FILES={'美化':'美化.html','直链':'直链.html'};          // 以后别的 App 的文件也加在这里
  const appLayer=document.getElementById('appLayer'),appFrame=document.getElementById('appFrame');
  let appOpen=false,appCloseTimer=0,appLoadTimer=0,themeFontEl=null;
  function appLabel(a){return(a.dataset.key||(a.querySelector('.label')||{}).textContent||'').trim()}
  function readTheme(){try{return JSON.parse(localStorage.getItem(THEME_KEY)||'null')||{}}catch(_){return{}}}
  function applyTheme(){
    const t=readTheme(),root=document.documentElement;
    // 背景：壁纸或纯色
    if(t.wallpaperCSS&&t.wallpaperCSS!=='none'){
      body.style.backgroundImage=t.wallpaperCSS;body.style.backgroundSize='cover';
      body.style.backgroundPosition='center';body.style.backgroundRepeat='no-repeat';body.style.backgroundColor='';
    }else{
      body.style.backgroundImage='none';body.style.backgroundColor=t.bgColor||'';
    }
    // html 画布跟 body 用同一张壁纸/底色：屏幕最边缘哪怕有 1px 没盖到，露出来的也是壁纸，不是浅灰底色
    root.style.backgroundImage=body.style.backgroundImage;root.style.backgroundSize='cover';
    root.style.backgroundPosition='center';root.style.backgroundRepeat='no-repeat';
    root.style.backgroundColor=body.style.backgroundColor||'#000';
    // 样式：图标大小/圆角、名字显示/颜色、壁纸压暗/模糊
    {
      const num=(v,d)=>{v=parseFloat(v);return isFinite(v)?v:d};
      if(t.iconSize==null&&t.iconRadius==null){root.style.removeProperty('--icon-size');root.style.removeProperty('--icon-radius')}
      else{const sz=Math.min(76,Math.max(52,num(t.iconSize,64))),rd=Math.min(50,Math.max(0,num(t.iconRadius,28)));
        root.style.setProperty('--icon-size',sz+'px');root.style.setProperty('--icon-radius',(sz*rd/100).toFixed(1)+'px')}
      body.classList.toggle('no-labels',t.showLabels===false);
      if(t.labelColor){root.style.setProperty('--label-color',t.labelColor);body.classList.add('has-label-color')}
      else{root.style.removeProperty('--label-color');body.classList.remove('has-label-color')}
      const hasWall=!!(t.wallpaperCSS&&t.wallpaperCSS!=='none');
      const blur=hasWall?Math.min(20,Math.max(0,num(t.wallBlur,0))):0,dim=hasWall?Math.min(60,Math.max(0,num(t.wallDim,0))):0;
      const wl=document.getElementById('wallLayer'),wd=document.getElementById('wallDim');
      if(wl){if(blur>0){const o=-(blur*2+8)+'px';wl.style.cssText='display:block;top:'+o+';left:'+o+';right:'+o+';bottom:'+o+';background-image:'+t.wallpaperCSS+';filter:blur('+blur+'px);-webkit-filter:blur('+blur+'px)'}else wl.style.cssText='display:none'}
      if(wd){if(dim>0)wd.style.cssText='display:block;background:rgba(0,0,0,'+(dim/100)+')';else wd.style.cssText='display:none'}
    }
    // 标签颜色：背景偏深（或用壁纸）时改成白字，保证看得清
    let dark=false;
    if(t.wallpaperCSS&&t.wallpaperCSS!=='none')dark=true;
    else{const m=/^#?([0-9a-f]{6})$/i.exec(String(t.bgColor||''));if(m){const n=parseInt(m[1],16);dark=(0.299*(n>>16&255)+0.587*(n>>8&255)+0.114*(n&255))<140}}
    body.classList.toggle('on-dark',dark);
    // 字体：自定义字体先注册，再写进全局变量
    const css=(t.customFonts||[]).filter(f=>f&&f.data&&f.family).map(f=>'@font-face{font-family:"'+f.family+'";src:url("'+f.data+'")}').join('\n');
    if(!themeFontEl){themeFontEl=document.createElement('style');document.head.appendChild(themeFontEl)}
    if(themeFontEl.textContent!==css)themeFontEl.textContent=css;
    if(t.font)root.style.setProperty('--app-font',t.font);else root.style.removeProperty('--app-font');
    // 改名：只改显示的文字，标识仍是原名
    {
      const al=t.appAlias||{};
      document.querySelectorAll('.app:not(.folder)').forEach(a=>{
        const key=appLabel(a);if(!key)return;const nm=al[key]||key;
        const lb=a.querySelector('.label');if(lb&&lb.textContent!==nm)lb.textContent=nm;
        const ic=a.querySelector('.icon');if(ic&&!ic.children.length&&ic.textContent!==nm)ic.textContent=nm;
      });
    }
    // 图标：按 App 名字对应
    const icons=t.appIcons||{};
    document.querySelectorAll('.app:not(.folder)').forEach(a=>{
      const ic=a.querySelector('.icon');if(!ic)return;
      const url=icons[appLabel(a)];
      if(url){ic.style.backgroundImage='url("'+String(url).replace(/"/g,'\\"')+'")';ic.classList.add('has-img')}
      else{ic.style.backgroundImage='';ic.classList.remove('has-img')}
    });
    document.querySelectorAll('.app.folder').forEach(renderFolderPreview);
  }
  // 把桌面上所有 App 的名字（含文件夹里的）给美化，让两边的 App 一致
  function publishAppNames(){
    try{
      const seen=new Set(),names=[];
      document.querySelectorAll('.app:not(.folder):not(.drag-ghost)').forEach(a=>{const n=appLabel(a);if(n&&!seen.has(n)){seen.add(n);names.push(n)}});
      localStorage.setItem(NAMES_KEY,JSON.stringify(names));
    }catch(_){}
  }
  /* 用 location.replace 切换页面：不会往浏览器历史里塞记录，
     否则安卓返回键 / 浏览器后退会先在 iframe 里来回翻，而不是退出应用 */
  let appHist=false,skipPops=0,toastTimer=0;
  function navFrame(url){try{appFrame.contentWindow.location.replace(url)}catch(_){appFrame.src=url}}
  function shellToast(msg){
    const t=document.getElementById('shellToast');if(!t)return;
    t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);
    toastTimer=setTimeout(()=>t.classList.remove('show'),3200);
  }
  function openApp(name){
    const file=APP_FILES[name];
    if(!file||appOpen)return;
    appOpen=true;clearTimeout(appCloseTimer);clearTimeout(appLoadTimer);
    publishAppNames();
    appLayer.classList.remove('loaded');
    appFrame.onload=()=>{
      if(!appOpen)return;
      let href='';try{href=String(appFrame.contentWindow.location.href)}catch(_){}
      if(href.indexOf('about:blank')===0)return;           // 还是空白页，等真正的页面
      // 文件不存在时服务器会返回一个 404 页，里面没有关闭按钮：直接提示并退回桌面
      try{if(/404|not found|找不到/i.test(appFrame.contentDocument.title||'')){shellToast('找不到 '+file+'，请确认它和小手机放在同一个文件夹里');closeApp();return}}catch(_){}
      appLayer.classList.add('loaded');
    };
    appLoadTimer=setTimeout(()=>{if(appOpen)appLayer.classList.add('loaded')},900);   // 兜底：加载太慢也要显示
    navFrame(file);                                  // 每次打开都重新加载，保证读到最新设置
    // 压一条历史记录：安卓返回键 / iOS 边缘返回手势 = 关闭应用，而不是退出整个小手机
    try{history.pushState({xsjApp:1},'');appHist=true}catch(_){appHist=false}
    appLayer.classList.add('show');appLayer.setAttribute('aria-hidden','false');
    requestAnimationFrame(()=>requestAnimationFrame(()=>appLayer.classList.add('open')));
  }
  function closeApp(fromPop){
    if(!appOpen)return;
    appOpen=false;applyTheme();clearTimeout(appLoadTimer);
    if(appHist){
      appHist=false;
      if(fromPop!==true){skipPops++;try{history.back()}catch(_){skipPops--}setTimeout(()=>{skipPops=0},600)}
    }
    appLayer.classList.remove('open');appLayer.setAttribute('aria-hidden','true');
    appCloseTimer=setTimeout(()=>{appLayer.classList.remove('show','loaded');navFrame('about:blank')},300);
  }
  window.addEventListener('popstate',()=>{
    if(skipPops>0){skipPops--;return}
    if(appOpen){appHist=false;closeApp(true)}
  });
  window.addEventListener('message',e=>{
    if(e.source!==appFrame.contentWindow)return;
    if(location.origin!=='null'&&e.origin!==location.origin)return;   // 只接受同源页面发来的消息
    const d=e.data||{};
    if(d.type==='phoneThemeSync')applyTheme();
    else if(d.type==='closeApp')closeApp();
    else if(d.type==='reload'){window.__skipLayoutSave=true;location.reload()}
  });
  window.addEventListener('storage',e=>{if(e.key===THEME_KEY)applyTheme()});

  /* ================= 保存 / 恢复布局 =================
     图标位置 / 文件夹 / 页数 / Dock 顺序都会记下来，下次打开原样恢复，只有你手动改才会变 */
  let layoutDirty=false;
  function assignAppIds(){
    const seen={};
    document.querySelectorAll('.app').forEach(a=>{
      const lab=(a.dataset.key||(a.querySelector('.label')||{}).textContent||'').trim();
      if(!lab)return;
      seen[lab]=(seen[lab]||0)+1;
      a.dataset.id=seen[lab]>1?lab+'#'+seen[lab]:lab;
    });
  }
  function serializeApp(a){
    if(isFolderEl(a)){
      const kids=openFolderEl===a?Array.from(folderModalGrid.children):Array.from(a.querySelector('.folder-items').children);
      return {folder:true,name:a.dataset.folderName||DEFAULT_FOLDER_NAME,slot:Number(a.dataset.slot||0),items:kids.map(x=>x.dataset.id).filter(Boolean)};
    }
    return {id:a.dataset.id,slot:Number(a.dataset.slot||0)};
  }
  function doSaveLayout(){
    if(window.__skipLayoutSave)return;
    if(appDrag)return;                       // 拖动过程中的临时位置不保存
    try{
      const keep=x=>x.folder||x.id;
      const data={v:1,
        pages:getPages().map(pg=>pageApps(pg).map(serializeApp).filter(keep)),
        dock:dockApps().map(serializeApp).filter(keep)};
      localStorage.setItem(LAYOUT_KEY,JSON.stringify(data));
    }catch(_){}
    publishAppNames();
  }
  function saveLayout(){clearTimeout(saveTimer);saveTimer=setTimeout(doSaveLayout,120)}
  function restoreLayout(){
    let data=null;
    try{data=JSON.parse(localStorage.getItem(LAYOUT_KEY)||'null')}catch(_){return false}
    if(!data||!Array.isArray(data.pages)||!data.pages.length)return false;
    const byId=new Map();
    document.querySelectorAll('.app').forEach(a=>{if(a.dataset.id)byId.set(a.dataset.id,a)});
    const used=new Set();
    // 还原一个条目：普通图标直接取回；文件夹重新建壳，成员只剩 1 个时还原成普通图标
    const buildItem=it=>{
      if(typeof it==='string')it={id:it};          // 兼容旧格式（Dock 只存 id）
      if(!it)return null;
      if(it.folder){
        const members=(it.items||[]).map(id=>byId.get(id)).filter(a=>a&&!used.has(a));
        if(!members.length)return null;
        members.forEach(a=>used.add(a));
        if(members.length===1)return members[0];
        const f=buildFolderShell(it.name||DEFAULT_FOLDER_NAME);
        const box=f.querySelector('.folder-items');
        members.forEach(a=>{a.remove();a.removeAttribute('style');box.appendChild(a)});
        renderFolderPreview(f);
        return f;
      }
      const a=byId.get(it.id);
      if(!a||used.has(a))return null;
      used.add(a);return a;
    };
    let cur=getPages();
    while(cur.length<data.pages.length){viewport.appendChild(createPageEl());cur=getPages()}
    data.pages.forEach((items,pi)=>{
      (items||[]).forEach(it=>{
        const el=buildItem(it);if(!el)return;
        cur[pi].appendChild(el);setDesktopSlot(el,it.slot,false);
      });
    });
    (data.dock||[]).forEach(it=>{const el=buildItem(it);if(el)dock.appendChild(el)});
    return true;
  }
  // 以后新增的图标（保存的布局里没有）放到第一个空格；Dock 超过 4 个时多出来的放回桌面
  function placeUnplaced(){
    const first=pages[0];
    dockApps().slice(MAX_DOCK_APPS).forEach(a=>{delete a.dataset.slot;first.appendChild(a)});
    pages.forEach(pg=>{
      const seen=new Set();
      pageApps(pg).forEach(a=>{
        if(a.dataset.slot===undefined||a.dataset.slot===''){
          if(!placeOnFreePage(a,pg))setDesktopSlot(a,0,false);
        }else{
          // 保存的布局里如果有两个图标占了同一格（数据损坏 / 版本升级），后来的挪到空格，不让它们叠在一起
          const sl=Number(a.dataset.slot);
          if(seen.has(sl)){placeOnFreePage(a,pg)}else seen.add(sl);
        }
      });
    });
  }
  window.addEventListener('pagehide',doSaveLayout);
  window.addEventListener('pageshow',e=>{if(e.persisted)applyTheme()});
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')doSaveLayout()});

  /* ================= 初始化 ================= */
  assignAppIds();
  const layoutRestored=restoreLayout();
  pages=getPages();
  pages.forEach(buildGrid);
  if(layoutRestored){placeUnplaced();normalizeDockSlots()}else initializeSlots();
  updateDockFit();
  commitPage(0);renderPages(0);
  applyTheme();publishAppNames();

  window.addEventListener('resize',()=>{
    cancelAnim();
    const rounded=Math.round(pagePos);
    commitPage(rounded);renderPages(rounded);
    if(appDrag){appDrag.dockRect=dockWrapper.getBoundingClientRect();appDrag.desktopRect=viewport.getBoundingClientRect()}
  },{passive:true});
})();
</script>
</body>
</html>
