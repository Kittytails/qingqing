<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="app-version" content="V1.2">
<title>手机界面 - 韩系ins风</title>
<style>
  :root{--bg-color:#f7f7f7;--text-color:#222;--gray-color:#888;--white:#fff}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;overscroll-behavior:none}
  body{background:var(--bg-color);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;display:flex;flex-direction:column;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
.dynamic-edit-pill{
    position:fixed;top:16px;left:50%;
    transform:translateX(-50%) scale(.9) translateY(-90px);
    display:flex;align-items:center;
    background:rgba(30,30,30,.85);
    backdrop-filter:blur(25px) saturate(1.8);-webkit-backdrop-filter:blur(25px) saturate(1.8);
    border-radius:28px;padding:6px 8px;gap:4px;z-index:10000;
    opacity:0;visibility:hidden;pointer-events:none;
    transition:transform .4s cubic-bezier(.2,.8,.2,1),opacity .25s ease,visibility 0s .4s;
    box-shadow:0 16px 40px rgba(0,0,0,.2),inset 0 1px 0 rgba(255,255,255,.15);
    white-space:nowrap;
  }
  body.edit-mode .dynamic-edit-pill{
    transform:translateX(-50%) scale(1) translateY(0);
    opacity:1;visibility:visible;pointer-events:auto;
    transition:transform .4s cubic-bezier(.2,.8,.2,1),opacity .25s ease,visibility 0s;
  }
  .dep-btn{height:40px;padding:0 12px;border-radius:20px;display:flex;align-items:center;justify-content:center;gap:5px;color:#fff;font-size:13px;font-weight:600;cursor:pointer;transition:background .2s,transform .1s}
  .dep-btn:active{background:rgba(255,255,255,.15);transform:scale(.95)}
  .dep-btn.danger{color:#ff453a}
  .dep-btn.danger:active{background:rgba(255,69,58,.15)}
  .dep-btn.primary{background:#fff;color:#000;padding:0 18px;margin-left:2px}
  .dep-btn.primary:active{background:#e5e5e5}
  .dep-divider{width:1px;height:20px;background:rgba(255,255,255,.2);margin:0 2px;border-radius:1px}

  .pages-viewport{position:relative;flex:1 1 auto;min-height:0;overflow:hidden;z-index:10;touch-action:none;transform:translateZ(0);backface-visibility:hidden;-webkit-backface-visibility:hidden}
  .desktop.home-page{position:absolute;inset:0;padding:24px 14px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(6,minmax(80px,1fr));align-content:start;gap:10px;overflow:hidden;visibility:hidden;pointer-events:none;transform:translate3d(0,0,0);will-change:transform;backface-visibility:hidden;-webkit-backface-visibility:hidden;contain:layout style paint}
  .desktop.home-page.is-shown{visibility:visible}
  .desktop.home-page.active-page{pointer-events:auto;z-index:2}
  body.edit-mode .desktop.home-page{padding-top:78px}

  .desktop-grid{position:absolute;inset:24px 14px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(6,minmax(80px,1fr));gap:10px;pointer-events:none;opacity:0;z-index:0;transition:opacity .18s ease}
  body.edit-mode .desktop-grid{opacity:1;inset:78px 14px 24px}
  .grid-slot{border-radius:20px;border:1px dashed rgba(0,0,0,.045);background:rgba(255,255,255,.08);transition:transform .12s ease,background .12s ease,border-color .12s ease,margin .12s ease;position:relative;z-index:0}
  .grid-slot.target{background:transparent!important;border-color:transparent!important;box-shadow:none!important;transform:none!important;margin:0!important}
  .drag-target-block{position:absolute;inset:0;z-index:4;pointer-events:none;border-radius:20px;background:rgba(0,0,0,.075);border:1px dashed rgba(0,0,0,.12);box-shadow:inset 0 0 0 1px rgba(0,0,0,.025);transition:left .08s ease,top .08s ease,width .08s ease,height .08s ease}
  .app.drag-placeholder{opacity:0!important;visibility:hidden!important;pointer-events:none!important;transform:translateZ(0)!important;transition:none!important;z-index:-1!important}
  .app.drag-placeholder iframe,.app.drag-placeholder .icon{visibility:hidden!important}

  .app{position:relative;width:100%;height:80px;min-width:0;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;z-index:2;transform:translate3d(0,0,0);transition:transform .18s cubic-bezier(.2,.8,.2,1);touch-action:none;-webkit-tap-highlight-color:transparent;-webkit-user-drag:none}
  .app .icon{pointer-events:none}
  .icon{width:64px;height:64px;background-color:var(--white);border-radius:18px;box-shadow:0 4px 15px rgba(0,0,0,.03);display:flex;justify-content:center;align-items:center;font-size:13px;color:var(--text-color);font-weight:500;border:1px solid rgba(0,0,0,.02);transition:transform .16s ease,background-color .16s,box-shadow .16s ease;flex-shrink:0}
  .app:active .icon{background-color:#f0f0f0}
  .label{font-size:12px;color:var(--gray-color);text-align:center;font-weight:400;white-space:nowrap;pointer-events:none}
  .app .icon{transition:transform .18s cubic-bezier(.2,.8,.2,1),background-color .18s ease,box-shadow .18s ease}
  .app:active .icon{transform:scale(.94);box-shadow:0 2px 8px rgba(0,0,0,.035)}


  .drag-ghost{position:fixed!important;z-index:2147483647!important;margin:0!important;pointer-events:none!important;transition:none!important;animation:none!important;transform:scale(1.04)!important;opacity:1!important;filter:drop-shadow(0 18px 28px rgba(0,0,0,.18))}
  .drag-ghost .icon{box-shadow:0 18px 38px rgba(0,0,0,.16)}
  .app.releasing{transition:left .24s cubic-bezier(.2,.9,.2,1),top .24s cubic-bezier(.2,.9,.2,1),transform .24s ease}
  body.edit-mode .app:not(.dragging):not(.drag-placeholder){animation:jiggle .55s infinite alternate ease-in-out}
  body.is-dragging-app .app{animation:none!important}
  @keyframes jiggle{0%{transform:rotate(-1.15deg)}100%{transform:rotate(1.15deg)}}

  .edge-hint{position:absolute;top:0;bottom:0;width:80px;pointer-events:none;z-index:50;opacity:0;transition:opacity .18s ease,background .18s ease}
  .edge-hint.left{left:0}
  .edge-hint.right{right:0}
  .edge-hint.active{opacity:1;background:linear-gradient(to right,rgba(0,0,0,.08),transparent)}
  .edge-hint.right.active{background:linear-gradient(to left,rgba(0,0,0,.08),transparent)}
  .edge-hint.armed{opacity:1;background:linear-gradient(to right,rgba(0,0,0,.18),transparent)}
  .edge-hint.right.armed{background:linear-gradient(to left,rgba(0,0,0,.18),transparent)}

  .home-indicator-area{position:relative;z-index:500;height:34px;flex:0 0 34px;display:flex;align-items:center;justify-content:center}
  .home-indicator{min-width:42px;height:28px;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:999px;background:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.88);box-shadow:0 5px 16px rgba(0,0,0,.055),inset 0 1px 0 rgba(255,255,255,.9);backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);transform:translateY(-8px);transition:min-width .2s ease,padding .2s ease,transform .2s ease,background .2s ease}
  .home-indicator.search-mode{min-width:76px;padding-left:12px;padding-right:14px}
  .search-label{display:inline-block;font-size:13px;line-height:1;color:#666;letter-spacing:.2px;white-space:nowrap;font-weight:500}
  .search-symbol{display:block;flex-shrink:0}
  .page-dots{display:none;align-items:center;justify-content:center;gap:5px;max-width:80px}
  .home-indicator.pages-mode .search-symbol,.home-indicator.pages-mode .search-label{display:none}
  .home-indicator.pages-mode .page-dots{display:inline-flex}
  .page-dot{width:6px;height:6px;border-radius:50%;background:rgba(90,90,90,.42);flex:0 0 6px;border:0;padding:0;cursor:pointer;transition:background .2s ease}
  .page-dot.active{width:7.5px;height:7.5px;flex-basis:7.5px;background:rgba(40,40,40,.78)}
  body.edit-mode .home-indicator{transform:translateY(-10px)}

  .dock-wrapper{padding:10px 15px 35px;z-index:10;flex:0 0 auto;display:flex;justify-content:center}
  .dock{height:88px;position:relative;background:rgba(255,255,255,.65);backdrop-filter:blur(25px);-webkit-backdrop-filter:blur(25px);border-radius:32px;display:flex;justify-content:space-around;align-items:center;padding:0 15px;box-shadow:0 8px 30px rgba(0,0,0,.05);border:1px solid rgba(255,255,255,.8);width:100%;touch-action:none;transition:width .22s cubic-bezier(.2,.8,.2,1)}
  .dock.drag-target{box-shadow:0 8px 30px rgba(0,0,0,.05),0 0 0 2px rgba(0,0,0,.045)}
  .dock .app{flex:1 1 0;min-width:0;max-width:72px;width:auto;height:auto;gap:0;transform:none;animation:none!important;transition:transform .16s ease}
  .dock .app .label{display:none}
  body.dragging-app .dock .app:not(.dragging){transition:transform .16s cubic-bezier(.2,.8,.2,1)}
  .app::before,.app::after{content:none!important;display:none!important}

  /* ===== 轻量精修：扁平、轻玻璃，不改变原有比例 ===== */
  body{
    background:var(--bg-color);
  }
  body::before{display:none}

  .desktop.home-page{
    padding-left:16px;padding-right:16px;
    column-gap:12px;row-gap:12px;
  }
  .desktop-grid{
    inset:24px 16px;
    gap:12px;
  }
  .grid-slot{
    border-radius:22px;
    background:rgba(255,255,255,.035);
  }
  .icon{
    box-shadow:0 4px 14px rgba(0,0,0,.035);
    border-color:rgba(0,0,0,.022);
  }
  .label{
    text-shadow:none;
  }

  /* 拖动目标：左上角定位点更大、更清楚 */
  .drag-target-block{
    background:rgba(0,0,0,.035);
    border:1.5px dashed rgba(0,0,0,.16);
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.025);
  }
  .drag-target-block::before{
    content:"";
    position:absolute;
    width:9px;height:9px;
    left:-5px;top:-5px;
    border-radius:50%;
    background:#555;
    border:2px solid rgba(255,255,255,.96);
    box-shadow:0 2px 7px rgba(0,0,0,.16);
    z-index:3;
  }

  /* Dock：降低玻璃厚重感 */
  .dock{
    background:rgba(255,255,255,.58);
    backdrop-filter:blur(16px) saturate(1.08);
    -webkit-backdrop-filter:blur(16px) saturate(1.08);
    box-shadow:0 7px 24px rgba(0,0,0,.045);
    border:1px solid rgba(255,255,255,.72);
  }
  /* Dock：图标数量少于4个时，整条胶囊栏本身收缩变窄并居中，而不是拉伸/放大图标 */
  .dock.dock-compact{
    width:auto;
    min-width:0;
    flex:0 0 auto;
    justify-content:center;
    gap:24px;
    padding:0 28px;
  }
  .dock.dock-compact .app{
    flex:0 0 72px;
  }

  /* 翻页边缘：更窄、更柔 */
  .edge-hint{
    width:56px;
    transition:opacity .14s ease,background .14s ease;
  }
  .edge-hint.active{
    background:linear-gradient(to right,rgba(0,0,0,.045),transparent 72%);
  }
  .edge-hint.right.active{
    background:linear-gradient(to left,rgba(0,0,0,.045),transparent 72%);
  }
  .edge-hint.armed{
    background:linear-gradient(to right,rgba(0,0,0,.085),transparent 76%);
  }
  .edge-hint.right.armed{
    background:linear-gradient(to left,rgba(0,0,0,.085),transparent 76%);
  }

  @media (max-height:720px){
    .desktop.home-page{padding-top:18px;padding-bottom:18px;row-gap:8px}
    .desktop-grid{inset:18px 14px;row-gap:8px}
    body.edit-mode .desktop-grid{inset:78px 14px 18px}
    .dock-wrapper{padding-top:7px;padding-bottom:27px}
    .dock{height:80px;border-radius:29px}
    .home-indicator-area{height:30px;flex-basis:30px}
  }

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{
      scroll-behavior:auto!important;
      transition-duration:.01ms!important;
      animation-duration:.01ms!important;
    }
  }

  /* ===== 文件夹 ===== */
  .app.folder .icon{padding:7px}
  .folder-mini{width:100%;height:100%;display:grid;grid-template-columns:1fr 1fr 1fr;grid-template-rows:1fr 1fr 1fr;gap:2px}
  .folder-mini span{background:rgba(0,0,0,.055);border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:7px;color:var(--text-color);overflow:hidden;line-height:1}
  .app.folder.folder-target .icon{transform:scale(1.14);box-shadow:0 8px 20px rgba(0,0,0,.2),inset 0 0 0 3px rgba(0,0,0,.1);transition:transform .16s ease,box-shadow .16s ease}
  .app.folder.folder-target-ready .icon{transform:scale(1.24);background:#ececec}

  .folder-modal-mask{position:fixed;inset:0;z-index:20000;display:flex;align-items:center;justify-content:center;background:rgba(20,20,22,0);opacity:0;visibility:hidden;pointer-events:none;transition:opacity .32s ease,background .38s ease,backdrop-filter .38s ease,visibility 0s .34s;-webkit-backdrop-filter:blur(0) saturate(1);backdrop-filter:blur(0) saturate(1)}
  .folder-modal-mask.open{opacity:1;visibility:visible;pointer-events:auto;background:rgba(20,20,22,.55);-webkit-backdrop-filter:blur(28px) saturate(1.15);backdrop-filter:blur(28px) saturate(1.15);transition:opacity .32s ease,background .38s ease,backdrop-filter .38s ease,visibility 0s}
  .folder-modal-mask.closing{opacity:0;visibility:visible;pointer-events:none;background:rgba(20,20,22,0);-webkit-backdrop-filter:blur(0) saturate(1);backdrop-filter:blur(0) saturate(1);transition:opacity .3s ease,background .3s ease,backdrop-filter .3s ease,visibility 0s .3s}
  .folder-modal-wrap{display:flex;flex-direction:column;align-items:center;width:min(300px,80vw)}
  .folder-modal-title{border:none;background:transparent;text-align:center;font-size:22px;font-weight:600;color:#fff;outline:none;width:100%;margin-bottom:16px;text-shadow:0 1px 6px rgba(0,0,0,.3);opacity:0;transform:translateY(6px) scale(.9);transition:opacity .3s ease .08s,transform .3s cubic-bezier(.2,.8,.2,1) .08s}
  .folder-modal-mask.open .folder-modal-title{opacity:1;transform:translateY(0) scale(1)}
  .folder-modal{width:100%;max-height:64vh;background:rgba(255,255,255,.2);-webkit-backdrop-filter:blur(40px) saturate(1.8);backdrop-filter:blur(40px) saturate(1.8);border:1px solid rgba(255,255,255,.32);border-radius:38px;padding:24px 16px;box-shadow:0 30px 70px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.35);transform:scale(.3);opacity:0;transform-origin:50% 50%;transition:transform .5s cubic-bezier(.32,1.38,.5,1),opacity .28s ease;display:flex;flex-direction:column;overflow:hidden;will-change:transform,opacity}
  .folder-modal-mask.open .folder-modal{transform:scale(1);opacity:1}
  .folder-modal-mask.closing .folder-modal{transition:transform .32s cubic-bezier(.5,0,.75,0),opacity .26s ease}
  .folder-modal-mask.closing .folder-modal-title{transition:opacity .2s ease,transform .2s ease}
  .folder-modal-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px 6px;overflow-y:auto;padding:4px 4px 8px;max-height:52vh;flex:0 1 auto;min-height:0}
  .folder-modal-grid .app{height:78px}
  .folder-modal-grid .label{color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.35)}
  .folder-modal-grid .app:not(.jiggle){animation:none!important}
  .folder-modal-grid .app.jiggle{animation:jiggle .55s infinite alternate ease-in-out}
  .folder-remove-badge{position:absolute;top:-4px;left:-4px;width:20px;height:20px;border-radius:50%;background:#444;color:#fff;font-size:13px;line-height:20px;text-align:center;display:none;z-index:5;box-shadow:0 2px 6px rgba(0,0,0,.3)}
  .folder-modal-grid .app.jiggle .folder-remove-badge{display:block}
</style>
</head>
<body>

<div class="dynamic-edit-pill">
  <div class="dep-btn" id="addPageBtn">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
    新页
  </div>
  <div class="dep-btn danger" id="delPageBtn">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
    删页
  </div>
  <div class="dep-divider"></div>
  <div class="dep-btn primary" id="doneBtn">完成</div>
</div>
<div class="pages-viewport" id="pagesViewport">
  <div class="edge-hint left" id="edgeHintLeft"></div>
  <div class="edge-hint right" id="edgeHintRight"></div>
  <div class="desktop home-page active-page" id="desktop" data-page="0">
    <!-- 只有“直链”这个图标配了 data-link，指向同目录下的 直链.html -->
    <div class="app"><div class="icon">微信</div><span class="label">微信</span></div>
    <div class="app"><div class="icon">世界书</div><span class="label">世界书</span></div>
    <div class="app"><div class="icon">档案</div><span class="label">档案</span></div>
    <div class="app" data-link="设置.html"><div class="icon">设置</div><span class="label">设置</span></div>
    <div class="app"><div class="icon">倒数日</div><span class="label">倒数日</span></div>
    <div class="app"><div class="icon">美化</div><span class="label">美化</span></div>
    <div class="app" data-link="直链.html"><div class="icon">直链</div><span class="label">直链</span></div>
    <div class="app" data-link="名册.html"><div class="icon">名册</div><span class="label">名册</span></div>
  </div>
</div>

<div class="home-indicator-area" id="homeIndicatorArea">
  <div class="home-indicator" id="homeIndicator" aria-label="页面指示器">
    <svg class="search-symbol" id="searchSymbol" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#777" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8"></circle>
      <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
    </svg>
    <span class="search-label" id="searchLabel">搜索</span>
    <span class="page-dots" id="pageDots"></span>
  </div>
</div>

<div class="dock-wrapper">
  <div class="dock" id="dock">
    <div class="app"><div class="icon">短信</div><span class="label">短信</span></div>
    <div class="app"><div class="icon">浏览器</div><span class="label">浏览器</span></div>
    <div class="app"><div class="icon">电话</div><span class="label">电话</span></div>
    <div class="app"><div class="icon">此刻</div><span class="label">此刻</span></div>
  </div>
</div>

<div class="folder-modal-mask" id="folderModalMask">
  <div class="folder-modal-wrap">
    <input class="folder-modal-title" id="folderModalTitle" maxlength="8">
    <div class="folder-modal" id="folderModal">
      <div class="folder-modal-grid" id="folderModalGrid"></div>
    </div>
  </div>
</div>

<script>
(() => {
  'use strict';
  const COLS=4,ROWS=6,SLOT_COUNT=COLS*ROWS;
  const LONG_PRESS_MS=700,CANCEL_PRESS_PX=10,SWIPE_START_PX=5,SWIPE_AXIS_RATIO=1.12,VERTICAL_BAIL_PX=10;
  const FLIP_RATIO=.10,FLIP_VELOCITY=.58,EDGE_DAMP=.22;
  const EDGE_ZONE=72,EDGE_HOLD_MS=160,EDGE_REPEAT_DELAY=1200,EDGE_FLIP_DURATION=440;
  const FOLDER_HOVER_MS=420,MAX_FOLDER_APPS=12,PUSH_DELAY_MS=220;

  const body=document.body;
  const viewport=document.getElementById('pagesViewport');
  const dock=document.getElementById('dock');
  const homeIndicator=document.getElementById('homeIndicator');
  const searchSymbol=document.getElementById('searchSymbol');
  const searchLabel=document.getElementById('searchLabel');
  const pageDots=document.getElementById('pageDots');
  const addPageBtn=document.getElementById('addPageBtn');
  const delPageBtn=document.getElementById('delPageBtn');
  const doneBtn=document.getElementById('doneBtn');
  const edgeHintLeft=document.getElementById('edgeHintLeft');
  const edgeHintRight=document.getElementById('edgeHintRight');
  const folderModalMask=document.getElementById('folderModalMask');
  const folderModalTitle=document.getElementById('folderModalTitle');
  const folderModalGrid=document.getElementById('folderModalGrid');
  const folderModalWrap=document.querySelector('.folder-modal-wrap');
  const folderModal=document.getElementById('folderModal');
  let openFolderEl=null,folderEditMode=false,folderPressTimer=null,folderPressOrigin=null,folderCloseTimer=null,folderSuppressClick=false;

  let pages=[],currentPageIndex=0,desktop=null;
  let pagePos=0,rafHandle=0,anim=null;
  let editMode=false,appDrag=null,swipe=null,pressTimer=null,pressOrigin=null,pressStartTime=0,suppressNextClick=false;
  let edgeTimer=null,edgeDir=0,edgeHasFlipped=false;

  const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
  const easeOutSmooth=t=>1-Math.pow(1-t,3.05);
  const damp=x=>Math.min(x*EDGE_DAMP,EDGE_DAMP);
  const isWidgetEl=el=>el.classList.contains('widget-2x2')||el.classList.contains('widget-4x2')||el.classList.contains('widget-4x3');
  const isFolderEl=el=>!!el&&el.classList&&el.classList.contains('folder');

  function getPages(){return Array.from(viewport.querySelectorAll(':scope > .desktop.home-page'))}

  function renderPages(pos){
    const n=pages.length;
    for(let i=0;i<n;i++){
      const p=pages[i],rel=i-pos,inView=rel>-1.5&&rel<1.5;
      if(inView){

  function findFreeSlot(desktopEl,w,h,except){
    const items=Array.from(desktopEl.querySelectorAll(':scope > .app')).filter(a=>a!==except);
    const occupied=Array.from({length:ROWS},()=>Array(COLS).fill(false));
    items.forEach(a=>{
      const idx=Number(a.dataset.slot);
      if(isNaN(idx))return;
      const aw=Number(a.dataset.w||1),ah=Number(a.dataset.h||1);
      const ac=idx%COLS,ar=Math.floor(idx/COLS);
      for(let dy=0;dy<ah;dy++)for(let dx=0;dx<aw;dx++){

      let free=true;

  function relocateOverlaps(widgetEl){
    if(!widgetEl||widgetEl.dataset.slot==null)return;
    const queue=[widgetEl];
    const moved=new Set([widgetEl]);
    let guard=0;
    while(queue.length && guard++<COLS*ROWS*2){
      const anchor=queue.shift();
      if(!anchor||anchor.dataset.slot==null)continue;
      const si=Number(anchor.dataset.slot);
      const sw=Number(anchor.dataset.w||1),sh=Number(anchor.dataset.h||1);
      const sc=si%COLS,sr=Math.floor(si/COLS);
      const overlaps=desktopApps().filter(a=>{
        if(a===anchor||moved.has(a))return false;
        const ai=Number(a.dataset.slot);
        if(isNaN(ai))return false;
        const aw=Number(a.dataset.w||1),ah=Number(a.dataset.h||1);
        const ac=ai%COLS,ar=Math.floor(ai/COLS);
        return !(sc+sw<=ac||sc>=ac+aw||sr+sh<=ar||sr>=ar+ah);
      });
      overlaps.forEach(a=>{

  }

  }
  function releaseDesktopReflow(d){restorePush(d)}
  function updateDesktopDragState(d,x,y,aw,ah){
    if(d.baselinePage!==desktop){
      if(d.baselinePage)restorePush(d);
      captureBase(d);
      clearFolderHover(d);
    }
    const mergeTarget=(aw===1&&ah===1)?findFolderMergeTarget(d,x,y):null;
    if(mergeTarget){
      setFolderHover(d,mergeTarget);
      clearTarget();
      restorePush(d);
      d.currentArea='desktop';d.currentSlot=Number(mergeTarget.dataset.slot);
      return;
    }
    clearFolderHover(d);
    const slot=nearestDesktopSlot(x,y,aw,ah);
    if(slot!==d.lastInsertIndex){
      const occupied=pageApps(desktop,d.app).some(a=>Number(a.dataset.slot)===slot);
      if(!occupied){applyPush(d,slot);d.lastInsertIndex=slot}
      else{
        // 目标格有图标：先停留一小会儿再顺推，给"悬停合成文件夹"留出时间
        restorePush(d);d.lastInsertIndex=slot;
        d.pushTimer=setTimeout(()=>{
          if(appDrag===d&&d.lastInsertIndex===slot&&d.currentArea==='desktop'&&!d.folderHoverApp){applyPush(d,slot);d.lastInsertIndex=slot}
        },PUSH_DELAY_MS);
      }
    }
    d.currentArea='desktop';d.currentSlot=slot;
    showTarget('desktop',slot,aw,ah);
  }

  function moveAppDrag(e){
    const d=appDrag;
    if(!d)return;
    e.preventDefault();
    if(!d.moved){
      const dx=e.clientX-d.startX,dy=e.clientY-d.startY;
      if(dx*dx+dy*dy>20){
        d.moved=true;
        d.app.classList.add('drag-placeholder','dragging');
        body.classList.add('is-dragging-app','dragging-app');
        showTarget(d.currentArea,d.currentSlot,Number(d.app.dataset.w||1),Number(d.app.dataset.h||1));
        if(!d.ghost)d.ghost=createDragGhost(d.app,d.rect);
      }
    }
    if(!d.moved)return;
    if(d.ghost){
      d.ghost.style.left=(e.clientX-d.offsetX)+'px';
      d.ghost.style.top=(e.clientY-d.offsetY-2)+'px';
    }
    const dockRect=d.dockRect;
    const desktopRect=d.desktopRect;
    const isWidget=isWidgetEl(d.app);
    const aw=Number(d.app.dataset.w||1),ah=Number(d.app.dataset.h||1);
    if(pointInRect(e.clientX,e.clientY,dockRect)&&!isWidget&&dockHasRoom(d.app)){
      clearFolderHover(d);releaseDesktopReflow(d);
      d.currentArea='dock';d.currentSlot=nearestDockInsertIndex(e.clientX);
      showTarget('dock',d.currentSlot);clearEdgeTimer();
    }else if(pointInRect(e.clientX,e.clientY,desktopRect)){
      d.currentArea='desktop';
      if(isWidget){
        clearFolderHover(d);
        d.currentSlot=nearestDesktopSlot(e.clientX,e.clientY,aw,ah);
        showTarget('desktop',d.currentSlot,aw,ah);
      }else{
        updateDesktopDragState(d,e.clientX,e.clientY,aw,ah);
      }
      checkEdgeTrigger(e.clientX,desktopRect);
    }else if(pointInRect(e.clientX,e.clientY,dockRect)){
      clearFolderHover(d);releaseDesktopReflow(d);clearTarget();clearEdgeTimer();
    }else{clearFolderHover(d);releaseDesktopReflow(d);clearEdgeTimer()}
  }

  function endAppDrag(e){
    const d=appDrag;if(!d||e.pointerId!==d.pointerId)return;
    clearEdgeTimer();edgeHasFlipped=false;
    if(d.moved||d.fromLongPress){suppressNextClick=true;setTimeout(()=>{suppressNextClick=false},350)}
    const app=d.app;
    const aw=Number(app.dataset.w||1),ah=Number(app.dataset.h||1);
    const isWidget=isWidgetEl(app);

    if(d.justAdded&&!d.moved){
      app.classList.remove('drag-placeholder','dragging');
      if(d.ghost)d.ghost.remove();
      clearTarget();
      appDrag=null;
      body.classList.remove('is-dragging-app','dragging-app');
      requestAnimationFrame(fitDesktopWidgets);
      return;
    }

    const mergeTarget=d.folderReady?d.folderHoverApp:null;
    clearFolderHover(d);
    if(mergeTarget&&mergeTarget.isConnected&&mergeTarget!==app){
      app.classList.remove('drag-placeholder','dragging');
      if(d.ghost)d.ghost.remove();
      clearTarget();
      mergeAppsIntoFolder(mergeTarget,app);
      normalizeDockSlots();updateDockFit();
      try{app.releasePointerCapture(d.pointerId)}catch(_){}
      appDrag=null;
      body.classList.remove('is-dragging-app','dragging-app');
      updatePageIndicator();
      requestAnimationFrame(fitDesktopWidgets);
      return;
    }

    const dockRect=d.dockRect;
    const desktopRect=d.desktopRect;
    let area=d.currentArea,slot=d.currentSlot;
    if(pointInRect(e.clientX,e.clientY,dockRect)&&!isWidget&&dockHasRoom(app)){
      area='dock';slot=nearestDockInsertIndex(e.clientX);
    }else if(isWidget&&pointInRect(e.clientX,e.clientY,desktopRect)){
      area='desktop';slot=nearestDesktopSlot(e.clientX,e.clientY,aw,ah);
    }else if(!isWidget&&pointInRect(e.clientX,e.clientY,desktopRect)){
      area='desktop';slot=nearestDesktopSlot(e.clientX,e.clientY,aw,ah);
    }
    clearTarget();
    app.classList.remove('drag-placeholder','dragging');
    if(d.ghost)d.ghost.remove();
    if(area==='dock'){
      const others=dockApps().filter(x=>x!==app);
      const at=clamp(slot,0,others.length);
      dock.insertBefore(app,others[at]||null);
      normalizeDockSlots();
      updateDockFit();
    }else{
      if(!isWidget){ensureBase(d);applyPush(d,slot)}
      if(!isWidget){const clash=occupiedDesktop(slot,app,aw,ah);if(clash){const fs=findFreeSlot(desktop,aw,ah,app);if(fs>=0)slot=fs}}
      if(app.parentElement!==desktop)desktop.appendChild(app);
      setDesktopSlot(app,slot,true);
      if(isWidget)relocateOverlaps(app);
      updateDockFit();
    }
    try{app.releasePointerCapture(d.pointerId)}catch(_){}
    appDrag=null;
    body.classList.remove('is-dragging-app','dragging-app');
    updatePageIndicator();
    requestAnimationFrame(fitDesktopWidgets);
  }

  function cancelAppDrag(){
    const d=appDrag;if(!d)return;
    clearEdgeTimer();edgeHasFlipped=false;
    clearFolderHover(d);
    if(d.moved){suppressNextClick=true;setTimeout(()=>{suppressNextClick=false},350)}
    const app=d.app;
    app.classList.remove('drag-placeholder','dragging');
    if(d.ghost)d.ghost.remove();
    restorePush(d);
    if(d.originArea==='dock'){
      if(app.parentElement!==dock)dock.appendChild(app);
      const items=dockApps().filter(x=>x!==app);
      dock.insertBefore(app,items[Math.min(d.originSlot,items.length)]||null);
      normalizeDockSlots();
    }else{
      const originPage=pages[d.originPageIndex]||pages[0];
      if(app.parentElement!==originPage)originPage.appendChild(app);
      setDesktopSlot(app,d.originSlot,false);
    }
    updateDockFit();
    try{app.releasePointerCapture(d.pointerId)}catch(_){}
    clearTarget();appDrag=null;
    body.classList.remove('is-dragging-app','dragging-app');
    requestAnimationFrame(fitDesktopWidgets);
  }


  function buildFolderShell(name){
    const folder=document.createElement('div');
    folder.className='app folder';
    folder.dataset.folderName=name;
    folder.innerHTML='<div class="icon folder-icon"><div class="folder-mini"></div></div><span class="label"></span><div class="folder-items" style="display:none"></div>';
    folder.querySelector('.label').textContent=name;
    return folder;
  }
  function renderFolderPreview(folder){
    const mini=folder.querySelector('.folder-mini');
    const items=Array.from(folder.querySelector('.folder-items').children).slice(0,9);
    mini.innerHTML='';
    items.forEach(a=>{
      const span=document.createElement('span');
      const srcIcon=a.querySelector('.icon');
      span.textContent=srcIcon?srcIcon.textContent.trim().slice(0,2):'';
      mini.appendChild(span);
    });
  }
  function addAppsToFolder(folder,appsArr){
    const items=folder.querySelector('.folder-items');
    const room=MAX_FOLDER_APPS-items.children.length;
    appsArr.slice(0,Math.max(0,room)).forEach(a=>{a.remove();a.removeAttribute('style');items.appendChild(a)});
    renderFolderPreview(folder);
    if(navigator.vibrate)navigator.vibrate(16);
  }
  function mergeAppsIntoFolder(targetApp,movingApp){
    if(isFolderEl(targetApp)){
      addAppsToFolder(targetApp,[movingApp]);
      return;
    }
    const slot=Number(targetApp.dataset.slot||0);
    const parent=targetApp.parentElement;
    const folder=buildFolderShell('未命名文件夹');
    parent.insertBefore(folder,targetApp);
    const items=folder.querySelector('.folder-items');
    targetApp.remove();movingApp.remove();
    targetApp.removeAttribute('style');movingApp.removeAttribute('style');
    items.appendChild(targetApp);items.appendChild(movingApp);
    setDesktopSlot(folder,slot,true);
    renderFolderPreview(folder);
    if(navigator.vibrate)navigator.vibrate(16);
  }
  function closeFolderModalRaw(){
    clearTimeout(folderCloseTimer);
    folderModalMask.classList.remove('open');
    folderModalMask.classList.add('closing');
    folderCloseTimer=setTimeout(()=>{
      folderModalMask.classList.remove('closing');
      folderModalGrid.innerHTML='';
    },320);
    openFolderEl=null;folderEditMode=false;
  }
  function closeFolderModal(){
    const folder=openFolderEl;
    if(!folder){closeFolderModalRaw();return}
    const items=folder.querySelector('.folder-items');
    Array.from(folderModalGrid.children).forEach(a=>{
      const badge=a.querySelector('.folder-remove-badge');if(badge)badge.remove();
      a.classList.remove('jiggle');
      items.appendChild(a);
    });
    folder.dataset.folderName=folderModalTitle.value.trim()||'未命名文件夹';
    folder.querySelector('.label').textContent=folder.dataset.folderName;
    renderFolderPreview(folder);
    closeFolderModalRaw();
    saveLayout();
  }
  function removeFromOpenFolder(app){
    const folder=openFolderEl;if(!folder||!app)return;
    const badge=app.querySelector('.folder-remove-badge');if(badge)badge.remove();
    app.classList.remove('jiggle');
    app.remove();app.removeAttribute('style');
    desktop.appendChild(app);
    {const fs=findFreeSlot(desktop,1,1,app);setDesktopSlot(app,fs>=0?fs:0,true)}
    if(navigator.vibrate)navigator.vibrate(10);
    const remaining=Array.from(folderModalGrid.children);
    if(remaining.length<=1){
      const fslot=Number(folder.dataset.slot);
      remaining.forEach(a=>{
        const b=a.querySelector('.folder-remove-badge');if(b)b.remove();
        a.classList.remove('jiggle');
        a.remove();a.removeAttribute('style');
        desktop.appendChild(a);
        setDesktopSlot(a,isNaN(fslot)?0:fslot,true);
      });
      folder.remove();
      closeFolderModalRaw();
    }
    saveLayout();
  }
  function openFolder(folder){
    if(appDrag||openFolderEl)return;
    clearTimeout(folderCloseTimer);
    folderModalMask.classList.remove('closing');
    openFolderEl=folder;folderEditMode=false;
    folderModalTitle.value=folder.dataset.folderName||'未命名文件夹';
    const items=folder.querySelector('.folder-items');
    folderModalGrid.innerHTML='';
    Array.from(items.children).forEach(a=>{
      a.removeAttribute('style');
      const badge=document.createElement('div');
      badge.className='folder-remove-badge';badge.textContent='×';
      a.appendChild(badge);
      folderModalGrid.appendChild(a);
    });
    const iconEl=folder.querySelector('.icon');
    const iconRect=iconEl.getBoundingClientRect();
    const mRect=folderModal.getBoundingClientRect();
    const ox=((iconRect.left+iconRect.width/2)-mRect.left)/mRect.width*100;
    const oy=((iconRect.top+iconRect.height/2)-mRect.top)/mRect.height*100;
    folderModal.style.transformOrigin=clamp(ox,0,100)+'% '+clamp(oy,0,100)+'%';
    folderModalMask.classList.add('open');
    if(navigator.vibrate)navigator.vibrate(10);
  }

  // 轻量增强：点击桌面空白处时给页面一个极短的触感反馈；不改变原有逻辑。
  function softHaptic(){
    if(navigator.vibrate) navigator.vibrate(4);
  }

  function enterEditMode(){if(editMode)return;editMode=true;body.classList.add('edit-mode');if(navigator.vibrate)navigator.vibrate(45)}
  function exitEditMode(){if(!editMode)return;if(appDrag)cancelAppDrag();editMode=false;body.classList.remove('edit-mode');clearTarget();clearEdgeTimer();edgeHasFlipped=false;saveLayout()}


  function openAppLink(link){
    if(!link)return;
    link=link.trim();
    if(!link)return;
    if(/^(tel:|mailto:|sms:)/i.test(link)){location.href=link;return}
    if(/^https?:\/\//i.test(link)){window.open(link,'_blank','noopener');return}
    location.href=link;
  }

  body.addEventListener('click',e=>{
    if(suppressNextClick)return;
    const appEl=e.target.closest('.app');
    if(appEl&&isFolderEl(appEl)&&!e.target.closest('.folder-modal-mask')){
      openFolder(appEl);
      return;
    }
    if(!editMode){
      if(appEl)openAppLink(appEl.dataset.link);
    }
    if(editMode&&!e.target.closest('.app')&&!e.target.closest('.dynamic-edit-pill')&&!e.target.closest('.widget-modal')&&!e.target.closest('.folder-modal-mask'))exitEditMode();
  });

  folderModalMask.addEventListener('click',e=>{if(e.target===folderModalMask)closeFolderModal()});
  folderModalGrid.addEventListener('pointerdown',e=>{
    const appEl=e.target.closest('.app');if(!appEl)return;
    folderPressOrigin={x:e.clientX,y:e.clientY};
    clearTimeout(folderPressTimer);
    folderPressTimer=setTimeout(()=>{
      folderEditMode=true;
      Array.from(folderModalGrid.children).forEach(a=>a.classList.add('jiggle'));
      if(navigator.vibrate)navigator.vibrate(30);
      folderSuppressClick=true;setTimeout(()=>{folderSuppressClick=false},350);
    },LONG_PRESS_MS);
  });
  folderModalGrid.addEventListener('pointermove',e=>{
    if(!folderPressOrigin)return;
    const dx=e.clientX-folderPressOrigin.x,dy=e.clientY-folderPressOrigin.y;
    if(dx*dx+dy*dy>CANCEL_PRESS_PX*CANCEL_PRESS_PX){clearTimeout(folderPressTimer);folderPressOrigin=null}
  });
  ['pointerup','pointercancel'].forEach(evt=>folderModalGrid.addEventListener(evt,()=>{clearTimeout(folderPressTimer);folderPressOrigin=null}));
  folderModalGrid.addEventListener('click',e=>{
    if(folderSuppressClick)return;
    const badge=e.target.closest('.folder-remove-badge');
    if(badge){e.stopPropagation();removeFromOpenFolder(badge.closest('.app'));return}
    if(folderEditMode){
      e.stopPropagation();
      folderEditMode=false;
      Array.from(folderModalGrid.children).forEach(a=>a.classList.remove('jiggle'));
    }
  });

  function addPage(){if(!editMode)return;const page=document.createElement('div');page.className='desktop home-page';page.dataset.page=String(pages.length);viewport.appendChild(page);buildGrid(page);pages=getPages();saveLayout();if(navigator.vibrate)navigator.vibrate(30);animateTo(pages.length-1,420)}
  function deletePage(){
    if(!editMode)return;
    if(currentPageIndex===0||pages.length<=1){if(navigator.vibrate)navigator.vibrate([18,35,18]);return}
    cancelAnim();
    const delIdx=currentPageIndex,toDelete=pages[delIdx];
    const orphans=Array.from(toDelete.querySelectorAll(':scope > .app'));
    const origSlots=new Map(orphans.map(x=>[x,Number(x.dataset.slot)]));
    // 只搬动被删页里的 APP：优先放前一页，其次其他页；其他页面的图标保持原位
    const targets=[pages[delIdx-1],...pages.filter((pg,i)=>pg!==toDelete&&i!==delIdx-1)];
    const placed=[];
    for(const app of orphans){
      const w=Number(app.dataset.w||1),h=Number(app.dataset.h||1);
      let ok=false;
      for(const pg of targets){
        const free=findFreeSlot(pg,w,h,app);
        if(free>=0){pg.appendChild(app);setDesktopSlot(app,free,false);placed.push(app);ok=true;break}
      }
      if(!ok){
        placed.forEach(x=>{toDelete.appendChild(x);setDesktopSlot(x,origSlots.get(x),false)});
        if(navigator.vibrate)navigator.vibrate([18,35,18]);
        return;
      }
    }
    toDelete.remove();
    pages=getPages();pages.forEach((pg,i)=>{pg.dataset.page=String(i)});
    pages.forEach(pg=>buildGrid(pg));
    let newIdx=Math.min(delIdx,pages.length-1);if(newIdx<0)newIdx=0;
    commitPage(newIdx);renderPages(newIdx);saveLayout();
    if(navigator.vibrate)navigator.vibrate(30);
  }

  function updatePageIndicator(){
    const count=pages.length,isHome=currentPageIndex===0;
    homeIndicator.classList.toggle('search-mode',isHome);
    homeIndicator.classList.toggle('pages-mode',!isHome&&count>1);
    searchSymbol.style.display=isHome?'block':'none';
    searchLabel.style.display=isHome?'inline-block':'none';
    pageDots.innerHTML='';
    if(!isHome&&count>1){
      const windowSize=Math.min(3,count);
      let start=Math.max(0,currentPageIndex-Math.floor(windowSize/2));
      let end=start+windowSize-1;
      if(end>=count){end=count-1;start=Math.max(0,end-windowSize+1)}
      const frag=document.createDocumentFragment();
      for(let i=start;i<=end;i++){const dot=document.createElement('button');dot.type='button';dot.className='page-dot'+(i===currentPageIndex?' active':'');dot.setAttribute('aria-label','第 '+(i+1)+' 页');dot.addEventListener('click',ev=>{ev.stopPropagation();goToPage(i)});frag.appendChild(dot)}
      pageDots.appendChild(frag);
    }
  }

  document.addEventListener('pointerdown',onPointerDown,{passive:false});
  window.addEventListener('pointermove',onPointerMove,{passive:false});
  window.addEventListener('pointerup',onPointerUp,{passive:false});
  window.addEventListener('pointercancel',onPointerCancel,{passive:false});
  addPageBtn.addEventListener('click',addPage);
  delPageBtn.addEventListener('click',deletePage);
  doneBtn.addEventListener('click',exitEditMode);
  document.addEventListener('gesturestart',e=>e.preventDefault());

  // ===== 保存布局：图标位置 / 文件夹 / 页数 / Dock 顺序都会记下来，下次打开原样恢复，只有你手动改才会变 =====
  const LAYOUT_KEY='xsj_layout_v1';
  let saveTimer=0;
  function assignAppIds(){
    const seen={};
    document.querySelectorAll('.app').forEach(a=>{
      const lab=((a.querySelector('.label')||{}).textContent||'').trim();
      if(!lab)return;
      seen[lab]=(seen[lab]||0)+1;
      a.dataset.id=seen[lab]>1?lab+'#'+seen[lab]:lab;
    });
  }
  function serializeApp(a){
    if(isFolderEl(a)){
      const kids=openFolderEl===a?Array.from(folderModalGrid.children):Array.from(a.querySelector('.folder-items').children);
      return {folder:true,name:a.dataset.folderName||'未命名文件夹',slot:Number(a.dataset.slot||0),items:kids.map(x=>x.dataset.id).filter(Boolean)};
    }
    return {id:a.dataset.id,slot:Number(a.dataset.slot||0)};
  }
  function doSaveLayout(){
    if(appDrag)return;                       // 拖动过程中的临时位置不保存
    try{
      const data={v:1,
        pages:getPages().map(pg=>Array.from(pg.querySelectorAll(':scope > .app')).map(serializeApp).filter(x=>x.folder||x.id)),
        dock:dockApps().map(a=>a.dataset.id).filter(Boolean)};
      localStorage.setItem(LAYOUT_KEY,JSON.stringify(data));
    }catch(_){}
  }
  function saveLayout(){clearTimeout(saveTimer);saveTimer=setTimeout(doSaveLayout,120)}
  function restoreLayout(){
    let data=null;
    try{data=JSON.parse(localStorage.getItem(LAYOUT_KEY)||'null')}catch(_){return false}
    if(!data||!Array.isArray(data.pages)||!data.pages.length)return false;
    const byId=new Map();
    document.querySelectorAll('.app').forEach(a=>{if(a.dataset.id)byId.set(a.dataset.id,a)});
    let cur=getPages();
    while(cur.length<data.pages.length){
      const page=document.createElement('div');
      page.className='desktop home-page';page.dataset.page=String(cur.length);
      viewport.appendChild(page);cur=getPages();
    }
    const used=new Set();
    data.pages.forEach((items,pi)=>{
      const pageEl=cur[pi];if(!pageEl)return;
      (items||[]).forEach(it=>{
        if(it.folder){
          const members=(it.items||[]).map(id=>byId.get(id)).filter(a=>a&&!used.has(a));
          if(!members.length)return;
          members.forEach(a=>used.add(a));
          if(members.length===1){pageEl.appendChild(members[0]);setDesktopSlot(members[0],it.slot,false);return}
          const f=buildFolderShell(it.name||'未命名文件夹');
          const box=f.querySelector('.folder-items');
          members.forEach(a=>{a.remove();a.removeAttribute('style');box.appendChild(a)});
          pageEl.appendChild(f);renderFolderPreview(f);setDesktopSlot(f,it.slot,false);
        }else{
          const a=byId.get(it.id);if(!a||used.has(a))return;
          used.add(a);pageEl.appendChild(a);setDesktopSlot(a,it.slot,false);
        }
      });
    });
    (data.dock||[]).forEach(id=>{const a=byId.get(id);if(a&&!used.has(a)){used.add(a);dock.appendChild(a)}});
    return true;
  }
  // 以后新增的图标（保存的布局里没有）放到第一个空格；Dock 超过 4 个时多出来的放回桌面
  function placeUnplaced(){
    const first=getPages()[0];
    dockApps().slice(MAX_DOCK_APPS).forEach(a=>{delete a.dataset.slot;first.appendChild(a)});
    getPages().forEach(pg=>{
      Array.from(pg.querySelectorAll(':scope > .app')).forEach(a=>{
        if(a.dataset.slot===undefined||a.dataset.slot===''){
          const fs=findFreeSlot(pg,Number(a.dataset.w||1),Number(a.dataset.h||1),a);
          setDesktopSlot(a,fs>=0?fs:0,false);
        }
      });
    });
  }
  window.addEventListener('pagehide',doSaveLayout);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')doSaveLayout()});

  assignAppIds();
  const layoutRestored=restoreLayout();
  pages=getPages();
  pages.forEach(pg=>buildGrid(pg));
  if(layoutRestored){placeUnplaced();normalizeDockSlots()}else initializeSlots();
  updateDockFit();
  desktop=pages[0];pagePos=0;renderPages(0);commitPage(0);

  window.addEventListener('resize',()=>{cancelAnim();const rounded=Math.round(pagePos);pagePos=rounded;renderPages(rounded);commitPage(rounded);resizeWidgetPreviews();fitDesktopWidgets();if(appDrag){appDrag.dockRect=document.querySelector('.dock-wrapper').getBoundingClientRect();appDrag.desktopRect=viewport.getBoundingClientRect()}},{passive:true});
})();
</script>
<script>
/* 把本页和所有图标链接的页面名登记给「设置 → 拉取更新」，它会一次把这些页面都更新到最新版 */
(function(){
  try{
    var own=decodeURIComponent(location.pathname.split('/').pop()||'');
    var links=[].slice.call(document.querySelectorAll('[data-link]')).map(function(e){return (e.getAttribute('data-link')||'').trim()}).filter(function(l){return l&&!/^[a-z][a-z0-9+.-]*:/i.test(l)});
    var list=[own].concat(links).filter(function(v,i,a){return v&&a.indexOf(v)===i});
    localStorage.setItem('xsj_pages',JSON.stringify(list));
  }catch(e){}
})();
</script>
